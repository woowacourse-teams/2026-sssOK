<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>쏙</title>
    <meta name="description" content="사진·영상을 원본 그대로, 링크 하나로 쏙 넣어봐요!" />
    <!-- 앱 화면은 모두 이 파일을 받는다. 검색 노출은 루트의 랜딩(landing.html)만 맡고,
         방은 사적인 공간이라 앱 화면은 검색 결과에 올리지 않는다 -->
    <meta name="robots" content="noindex" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="192x192" />

    <!-- 홈 화면에 추가했을 때의 이름·아이콘. start_url 이 /home 인 이유 — 루트(/)는 CloudFront 가 랜딩으로 보낸다.
         iOS 는 manifest 아이콘 대신 apple-touch-icon 을 쓴다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="쏙" />

    <!-- 링크 미리보기. 크롤러는 JS 를 실행하지 않으니 여기 정적으로 둔다.
         값은 webpack.config.js 의 og 옵션에서 HTML 파일마다 다르게 채운다 -->
    <% const og = htmlWebpackPlugin.options.og; %>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="쏙" />
    <meta property="og:title" content="<%= og.title %>" />
    <meta property="og:description" content="<%= og.description %>" />
    <% if (og.url) { %>
    <meta property="og:url" content="<%= og.url %>" />
    <% } %>
    <meta property="og:image" content="<%= og.image %>" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="<%= og.imageAlt %>" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
