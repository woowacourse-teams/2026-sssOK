<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-56 -170 1000 940" width="1000" height="940" role="img" aria-label="구멍에서 나와 손을 흔드는 쏙 캐릭터">
  <style>
  svg { --orange: #f96b36; --dark: #2b231e; --paper: #fffbf8; }

  svg * { transform-box: view-box; }
  /* 첫 화면 인트로용: 한 번만 재생하고 인사하는 자세로 멈춘다 */
  .anim { animation-duration: 1.15s; animation-iteration-count: 1; animation-fill-mode: both; }

  /* 몸 전체: 구멍에서 튀어나와 자리 잡는다 */
  .rise { transform: translateY(35px); animation-name: rise; }
  @keyframes rise {
    0% { transform: translateY(560px); animation-timing-function: cubic-bezier(0.34, 1.5, 0.64, 1); }
    40%, 100% { transform: translateY(35px); }
  }

  /* 늘어났다 눌리는 탄성 */
  .squash { transform-origin: 455px 640px; animation-name: squash; animation-timing-function: ease-in-out; }
  @keyframes squash {
    0% { transform: scale(1, 1); }
    18% { transform: scale(0.94, 1.1); }
    34% { transform: scale(1, 1); }
    44% { transform: scale(1.04, 0.93); }
    56%, 100% { transform: scale(1, 1); }
  }

  /* 인사하는 동안 몸을 살짝 흔든다 */
  .tilt { transform-origin: 455px 640px; animation-name: tilt; animation-timing-function: ease-in-out; }
  @keyframes tilt {
    0%, 46% { transform: rotate(0deg); }
    62% { transform: rotate(2deg); }
    80% { transform: rotate(-1.5deg); }
    100% { transform: rotate(0deg); }
  }

  /* 왼팔: 솟을 때 끌림 → 멈추면 넘어감 → 예비 동작 → 두 번 흔들고 멈춘다 */
  .arm { transform-origin: 268px 475px; animation-name: shoulder; animation-timing-function: ease-in-out; }
  @keyframes shoulder {
    0%, 8% { transform: rotate(-3deg); }
    22% { transform: rotate(-9deg); }
    38% { transform: rotate(10deg); }
    46% { transform: rotate(-3deg); }
    60% { transform: rotate(12deg); }
    74% { transform: rotate(-3deg); }
    88% { transform: rotate(8deg); }
    100% { transform: rotate(0deg); }
  }

  /* 오른손: 구멍 위로 살짝 떴다가 가장자리에 걸친다 */
  .paw { animation-name: paw; }
  @keyframes paw {
    0%, 3% { transform: translateY(560px); animation-timing-function: cubic-bezier(0.34, 1.9, 0.64, 1); }
    42%, 100% { transform: translateY(0); }
  }
  /* 구멍 안에 있을 때만 가장자리로 가린다 */
  .paw-inside { opacity: 0; animation-name: inside; animation-timing-function: step-end; }
  .paw-outside { animation-name: outside; animation-timing-function: step-end; }
  @keyframes inside { 0% { opacity: 1; } 24%, 100% { opacity: 0; } }
  @keyframes outside { 0% { opacity: 0; } 24%, 100% { opacity: 1; } }

  /* 사진들이 흙처럼 튀어 올랐다가 땅에 떨어진 뒤 사라진다 */
  .photo-x { opacity: 0; animation-name: photo-x; animation-timing-function: cubic-bezier(0.3, 0.5, 0.6, 1); }
  @keyframes photo-x {
    0%, 2% { transform: translateX(0); opacity: 0; }
    3% { opacity: 1; }
    48% { transform: translateX(var(--dx)); }
    58% { transform: translateX(var(--dx)); opacity: 1; }
    70%, 100% { transform: translateX(var(--dx)); opacity: 0; }
  }
  .photo-y { animation-name: photo-y; }
  @keyframes photo-y {
    0%, 2% { transform: translateY(0); animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
    22% { transform: translateY(var(--up)); animation-timing-function: cubic-bezier(0.6, 0, 0.85, 0.5); }
    48% { transform: translateY(var(--land)); animation-timing-function: ease-out; }
    53% { transform: translateY(calc(var(--land) - 18px)); animation-timing-function: ease-in; }
    58%, 100% { transform: translateY(var(--land)); }
  }
  .photo-spin { transform-box: fill-box; transform-origin: center; animation-name: photo-spin; animation-timing-function: ease-out; }
  @keyframes photo-spin {
    0%, 2% { transform: rotate(0deg) scale(0.4); }
    22% { transform: rotate(calc(var(--r) * 0.55)) scale(calc(var(--s, 1) * 1.1)); }
    48%, 100% { transform: rotate(var(--r)) scale(var(--s, 1)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .anim { animation: none; }
  }
</style>
  <defs>
    <path id="body" d="M203,760 L203,420 C203,175 300,12 458,12 C616,12 713,175 713,420 L713,760 Z" />
    <path id="arm" d="M86.5,397.0 A64,64 0 0 1 172.4,302.1 L306.9,432.0 A58,58 0 0 1 229.1,518.0 Z" />
    <!-- 오른손: 둥근 손등 + 아래쪽 발가락 세 개 -->
    <path id="paw-shape" d="M565,632 A71,71 0 1 1 691,632 Q690,646 683,653 A22,22 0 0 1 641,657 A22,22 0 0 1 599,657 A22,22 0 0 1 571,651 Q566,644 565,632 Z" />
    <!-- 구멍 앞쪽 가장자리 위만 보이게 -->
    <clipPath id="inside-body"><use href="#body" /></clipPath>
    <clipPath id="above-rim">
      <path d="M-400,-600 H1300 V545 H885 A440,92 0 0 1 5,545 H-400 Z" />
    </clipPath>
    <clipPath id="above-rim-deep">
      <path d="M-400,-600 H1300 V545 H885 A440,68 0 0 1 5,545 H-400 Z" />
    </clipPath>
    <!-- 로고 속 사진 카드: 밝은 카드 + 해 + 산 -->
    <g id="photo-card" stroke-linejoin="round">
      <rect x="-60" y="-46" width="120" height="92" rx="14" fill="var(--paper)" stroke="var(--dark)" stroke-width="10" />
      <circle cx="-26" cy="-14" r="13" fill="var(--orange)" />
      <path d="M-44,32 L-12,-2 L6,16 L26,-12 L46,32 Z" fill="var(--orange)" stroke="var(--orange)" stroke-width="6" />
    </g>
    <g id="paw-art">
      <use href="#paw-shape" fill="none" stroke="var(--dark)" stroke-width="39" stroke-linejoin="round" />
      <use href="#paw-shape" fill="var(--orange)" />
      <path d="M641,657 V648 M599,657 V648" stroke="var(--dark)" stroke-width="9" stroke-linecap="round" />
    </g>
  </defs>

  <ellipse cx="445" cy="545" rx="440" ry="108" fill="var(--dark)" />

  <!-- 사진은 몸 뒤로 지나가고, 땅에 떨어진 뒤 사라진다 -->
  <g transform="translate(455 500)">
      <g class="anim photo-x" style="--dx: -420px"><g class="anim photo-y" style="--up: -300px; --land: 175px"><g class="anim photo-spin" style="--r: -372deg"><use href="#photo-card" /></g></g></g>
      <g class="anim photo-x" style="--dx: -250px; animation-delay: 0.049s"><g class="anim photo-y" style="--up: -470px; --land: 195px; animation-delay: 0.049s"><g class="anim photo-spin" style="--r: -190deg; animation-delay: 0.049s"><use href="#photo-card" /></g></g></g>
      <g class="anim photo-x" style="--dx: 60px; animation-delay: 0.099s"><g class="anim photo-y" style="--up: -560px; --land: 205px; animation-delay: 0.099s"><g class="anim photo-spin" style="--r: 168deg; animation-delay: 0.099s"><use href="#photo-card" /></g></g></g>
      <g class="anim photo-x" style="--dx: 280px; animation-delay: 0.024s"><g class="anim photo-y" style="--up: -450px; --land: 190px; animation-delay: 0.024s"><g class="anim photo-spin" style="--r: 195deg; animation-delay: 0.024s"><use href="#photo-card" /></g></g></g>
      <g class="anim photo-x" style="--dx: 420px; animation-delay: 0.074s"><g class="anim photo-y" style="--up: -280px; --land: 170px; animation-delay: 0.074s"><g class="anim photo-spin" style="--r: 372deg; animation-delay: 0.074s"><use href="#photo-card" /></g></g></g>
      <g class="anim photo-x" style="--dx: -340px; animation-delay: 0.123s"><g class="anim photo-y" style="--up: -400px; --land: 215px; animation-delay: 0.123s"><g class="anim photo-spin" style="--s: 0.7; --r: -200deg; animation-delay: 0.123s"><use href="#photo-card" /></g></g></g>
      <g class="anim photo-x" style="--dx: -130px; animation-delay: 0.016s"><g class="anim photo-y" style="--up: -520px; --land: 225px; animation-delay: 0.016s"><g class="anim photo-spin" style="--s: 0.7; --r: -345deg; animation-delay: 0.016s"><use href="#photo-card" /></g></g></g>
      <g class="anim photo-x" style="--dx: 170px; animation-delay: 0.148s"><g class="anim photo-y" style="--up: -500px; --land: 220px; animation-delay: 0.148s"><g class="anim photo-spin" style="--s: 0.7; --r: 350deg; animation-delay: 0.148s"><use href="#photo-card" /></g></g></g>
      <g class="anim photo-x" style="--dx: 360px; animation-delay: 0.091s"><g class="anim photo-y" style="--up: -380px; --land: 210px; animation-delay: 0.091s"><g class="anim photo-spin" style="--s: 0.7; --r: -170deg; animation-delay: 0.091s"><use href="#photo-card" /></g></g></g>
      <g class="anim photo-x" style="--dx: -480px; animation-delay: 0.173s"><g class="anim photo-y" style="--up: -200px; --land: 150px; animation-delay: 0.173s"><g class="anim photo-spin" style="--s: 0.7; --r: 190deg; animation-delay: 0.173s"><use href="#photo-card" /></g></g></g>
  </g>

  <g clip-path="url(#above-rim)">
    <g class="anim rise">
      <g class="anim squash">
        <g class="anim tilt">
          <!-- 굵은 선을 먼저 깔고 면을 덮어서 몸과 팔이 하나로 이어진 외곽선을 만든다 -->
          <g fill="none" stroke="var(--dark)" stroke-width="39" stroke-linejoin="round">
            <use href="#body" />
            <use href="#arm" class="anim arm" />
          </g>
          <g fill="var(--orange)">
            <use href="#body" />
            <use href="#arm" class="anim arm" />
          </g>

          <!-- 팔이 몸 위로 겹친 안쪽 선: 몸 안쪽에만 보이게 잘라서 외곽선과 겹쳐 뭉치지 않게 한다 -->
          <g clip-path="url(#inside-body)" fill="none" stroke="var(--dark)" stroke-linecap="round">
            <path class="anim arm" d="M172.4,302.1 L255.8,382.6" stroke-width="13" />
          </g>

          <g fill="var(--dark)">
            <ellipse class="anim eye" cx="369" cy="232" rx="20" ry="21" />
            <ellipse class="anim eye" cx="553" cy="255" rx="20" ry="21" />
            <ellipse cx="456" cy="272" rx="34" ry="25" />
          </g>
          <g fill="none" stroke="var(--dark)" stroke-width="13" stroke-linecap="round">
            <path d="M408,312 C431,340 476,342 498,318" stroke-linecap="butt" />
            <!-- 수염: 오른쪽 두 가닥과 대칭으로 왼쪽 두 가닥 -->
            <path d="M659,284 L726,272 M659,322 L724,343 M257,284 L190,272 M257,322 L192,343" stroke-width="12" />
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- 가림 영역은 움직이지 않는 바깥 그룹에 걸어야 손과 함께 따라 내려가지 않는다 -->
  <g class="anim paw-inside" clip-path="url(#above-rim-deep)">
    <g class="anim paw"><use href="#paw-art" /></g>
  </g>
  <g class="anim paw-outside">
    <g class="anim paw"><use href="#paw-art" /></g>
  </g>
</svg>
