name: Backend Dev Deploy

on:
  push:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - '!backend/monitoring/central/**'
      - '!backend/monitoring/grafana/**'
      - '!backend/monitoring/prometheus/**'
      - '!backend/monitoring/alertmanager/**'
      - '!backend/monitoring/loki/**'
      - '!backend/monitoring/alloy/write.local.alloy'
      - '!backend/monitoring/alloy/write.dual.alloy'
      - '!backend/docker-compose.prod.yml'
      - '!backend/docker-compose.monitoring.yml'
      - '!backend/nginx.conf'
      - '!backend/**/*.md'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-dev-deploy
  cancel-in-progress: false

jobs:
  build:
    name: 이미지 빌드 및 푸시
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      release-version: ${{ steps.version.outputs.release }}
      backend-version: ${{ steps.version.outputs.backend }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: meta
        run: |
          # GHCR 은 소문자 경로만 허용한다. dev는 릴리즈 태그가 없으니 커밋 해시로만 식별한다.
          REPO_LOWER=$(echo "ghcr.io/${GITHUB_REPOSITORY}/backend" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "image=${REPO_LOWER}:dev-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 버전 정보 읽기
        id: version
        run: |
          set -eu
          RELEASE_VERSION="$(tr -d ' \t\r\n' < VERSION)"
          BACKEND_VERSION="$(sed -n 's/^version=//p' backend/gradle.properties | tail -n 1 | tr -d ' \t\r')"
          echo "release=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "backend=${BACKEND_VERSION}" >> "$GITHUB_OUTPUT"
          echo "통합 릴리스 ${RELEASE_VERSION} / 백엔드 ${BACKEND_VERSION} / 커밋 ${GITHUB_SHA}"

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: JAR 빌드 (네이티브)
        working-directory: backend
        run: ./gradlew bootJar -x test --no-daemon

      - name: QEMU 설정 (크로스 아키텍처 빌드용)
        uses: docker/setup-qemu-action@v3

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:dev-latest
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.release }}
            BACKEND_VERSION=${{ steps.version.outputs.backend }}
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: dev 서버 배포
    needs: build
    # dev 러너에만 명시적으로 보낸다 (prod 러너와 섞이지 않도록).
    runs-on: [self-hosted, linux, ARM64, dev]
    environment: development

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 최초 포트 인계는 서버에서 검증 후 수행한다. CD가 호스트 서비스를 임의 중지하지 않는다.
      - name: 호스트 Nginx 전환 완료 확인
        run: |
          set -eu
          if systemctl is-active --quiet nginx || systemctl is-enabled --quiet nginx; then
            echo "::error::호스트 Nginx가 활성화돼 있습니다. Docker 전환 검증 후 호스트 서비스를 중지·비활성화하세요."
            exit 1
          fi

      - name: 배치 전 지표 포트 사설 IP 확인
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          PRIVATE_IP=$(python3 -B backend/monitoring/check-private-ip.py dev "$DEPLOY_PATH")
          echo "MONITORING_PRIVATE_IP=$PRIVATE_IP" >> "$GITHUB_ENV"

      - name: 배치 전 Alloy 설정 검증
        run: bash backend/monitoring/validate-alloy.sh dev

      - name: compose 파일 배치
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          mkdir -p "$DEPLOY_PATH/monitoring/alloy"
          mkdir -p "$DEPLOY_PATH/monitoring/nginx/container"
          cp backend/docker-compose.dev.yml "$DEPLOY_PATH/docker-compose.dev.yml"
          cp backend/monitoring/check-dev-node.sh "$DEPLOY_PATH/monitoring/check-dev-node.sh"
          cp backend/monitoring/nginx/container/default.conf.template "$DEPLOY_PATH/monitoring/nginx/container/default.conf.template"
          cp backend/monitoring/alloy/config.alloy "$DEPLOY_PATH/monitoring/alloy/config.alloy"
          cp backend/monitoring/alloy/write.central.alloy "$DEPLOY_PATH/monitoring/alloy/write.central.alloy"

      - name: 이미지 교체 및 헬스체크
        env:
          NEW_IMAGE: ${{ needs.build.outputs.image }}
          APP_RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          APP_BACKEND_VERSION: ${{ needs.build.outputs.backend-version }}
          APP_GIT_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          cd "$DEPLOY_PATH"

          # bind mount 파일 내용은 Compose가 감지하지 않으므로 해시를 컨테이너 라벨로 전달한다.
          # 전체 기동·롤백·후속 검사에서도 같은 값을 사용한다.
          NGINX_CONFIG_SHA=$(sha256sum monitoring/nginx/container/default.conf.template | cut -d ' ' -f 1)
          export NGINX_CONFIG_SHA
          COMPOSE="docker compose --env-file .env --env-file image.env -f docker-compose.dev.yml"
          IMAGE_REPOSITORY="${NEW_IMAGE%:*}"

          cleanup_old_images() {
            CURRENT_IMAGE="$(sed -n 's/^BACKEND_IMAGE=//p' image.env 2>/dev/null | tail -n 1)"
            PREVIOUS_IMAGE="$(sed -n 's/^BACKEND_IMAGE=//p' image.env.prev 2>/dev/null | tail -n 1)"

            echo "미사용 이전 이미지 정리 시작 (현재·직전 이미지는 보존)"
            docker image ls "$IMAGE_REPOSITORY" --format '{{.Repository}}:{{.Tag}}' |
              while IFS= read -r IMAGE; do
                [ "$IMAGE" = "$CURRENT_IMAGE" ] && continue
                [ "$IMAGE" = "$PREVIOUS_IMAGE" ] && continue
                [ "${IMAGE##*:}" = '<none>' ] && continue
                docker image rm "$IMAGE" || true
              done
            docker image prune -f > /dev/null 2>&1 || true
          }

          finish() {
            cleanup_old_images
            docker logout ghcr.io > /dev/null 2>&1 || true
          }
          trap finish EXIT

          # pull 전에 공간을 확보해 디스크 부족으로 배포가 시작조차 못 하는 상황을 막는다.
          cleanup_old_images

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # 롤백 대비로 직전 이미지 태그를 보관한다.
          if [ -f image.env ]; then
            cp image.env image.env.prev
          fi
          # 이미지와 버전을 한 파일에 같이 둔다 — 롤백으로 image.env.prev 를 되돌리면
          # 그 이미지가 실제로 배포됐을 때의 버전 정보도 같이 돌아간다.
          {
            echo "BACKEND_IMAGE=$NEW_IMAGE"
            echo "APP_RELEASE_VERSION=$APP_RELEASE_VERSION"
            echo "APP_BACKEND_VERSION=$APP_BACKEND_VERSION"
            echo "APP_GIT_SHA=$APP_GIT_SHA"
          } > image.env

          $COMPOSE pull
          # 템플릿 치환과 문법을 포트 게시 없이 먼저 검사한다.
          $COMPOSE run --rm --no-deps nginx nginx -t
          # 앱을 먼저 교체해 모니터링 의존성 실패와 분리한다. 이후 전체 스택 기동이 실패해도
          # 앱 헬스체크와 모니터링 자동 복구 절차까지 계속 진행한다.
          $COMPOSE up -d app
          if ! $COMPOSE up -d; then
            echo "일부 서비스 기동 실패 - 앱 헬스체크와 모니터링 복구 절차를 계속한다"
          fi
          echo "헬스체크 시작"
          # 호스트 Nginx를 경유하지 않고 앱의 8080을 직접 확인한다.
          APP_HEALTHY=false
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
              echo "헬스체크 성공 ($i번째 시도)"
              APP_HEALTHY=true
              break
            fi
            sleep 5
          done

          if [ "$APP_HEALTHY" != true ]; then
            echo "헬스체크 실패 - 직전 버전으로 롤백한다"
            $COMPOSE logs --tail 100 app || true

            if [ -f image.env.prev ]; then
              mv image.env.prev image.env
              $COMPOSE up -d
              echo "롤백 완료"
            else
              echo "직전 버전이 없어 롤백하지 못했다 (최초 배포로 추정)"
            fi

            exit 1
          fi

          # 템플릿 해시·이미지·Compose 설정이 바뀐 경우에만 재생성한다.
          $COMPOSE up -d --no-deps nginx
          $COMPOSE exec -T nginx nginx -t
          curl --noproxy '*' -fsS --max-time 5 --retry 10 --retry-delay 2 --retry-all-errors \
            -H 'Host: dev-api.ssssok.com' http://127.0.0.1/health > /dev/null

          # 파일 복사만으로는 Alloy가 새 설정을 읽지 않는다. 실행 중인 버전으로 다시 검사하고
          # 내부 HTTP reload 응답을 확인한다. 수집 위치 볼륨과 컨테이너는 유지한다.
          $COMPOSE exec -T alloy /bin/alloy validate /etc/alloy/config
          $COMPOSE exec -T nginx wget -q -T 10 -O - --post-data='' http://alloy:12345/-/reload

          # 중앙 연결 설정이 다음 앱 배포에서 사라지는 것을 탐지한다.
          # 실패 시 배포를 실패로 보고하되, 헬스체크를 통과한 앱은 롤백하지 않는다.
          bash monitoring/check-dev-node.sh

          # 개발 출발지에서 중앙 Loki가 로그를 수락하는지 확인한다.
          CENTRAL_URL=$($COMPOSE exec -T alloy printenv CENTRAL_LOKI_URL)
          payload=$(printf '{"streams":[{"stream":{"environment":"dev","service":"monitoring-deploy"},"values":[["%s","dev central deployment probe"]]}]}' "$(date +%s%N)")
          status=$(curl --noproxy '*' --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' --data "$payload" -o /dev/null -w '%{http_code}' "$CENTRAL_URL")
          [ "$status" = 204 ] || { echo "중앙 Loki 수신 검사 실패: HTTP $status"; exit 1; }
