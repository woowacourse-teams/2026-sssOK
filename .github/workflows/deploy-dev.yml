name: Backend Dev Deploy

on:
  push:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - '!backend/monitoring/central/**'
      - '!backend/monitoring/grafana/**'
      - '!backend/monitoring/prometheus/**'
      - '!backend/monitoring/alertmanager/**'
      - '!backend/monitoring/loki/**'
      - '!backend/monitoring/alloy/write.local.alloy'
      - '!backend/monitoring/alloy/write.dual.alloy'
      - '!backend/docker-compose.prod.yml'
      - '!backend/docker-compose.monitoring.yml'
      - '!backend/nginx.conf'
      - '!backend/**/*.md'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-dev-deploy
  cancel-in-progress: false

jobs:
  build:
    name: 이미지 빌드 및 푸시
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      release-version: ${{ steps.version.outputs.release }}
      backend-version: ${{ steps.version.outputs.backend }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: meta
        run: |
          # GHCR 은 소문자 경로만 허용한다. dev는 릴리즈 태그가 없으니 커밋 해시로만 식별한다.
          REPO_LOWER=$(echo "ghcr.io/${GITHUB_REPOSITORY}/backend" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "image=${REPO_LOWER}:dev-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 버전 정보 읽기
        id: version
        run: |
          set -eu
          RELEASE_VERSION="$(tr -d ' \t\r\n' < VERSION)"
          BACKEND_VERSION="$(sed -n 's/^version=//p' backend/gradle.properties | tail -n 1 | tr -d ' \t\r')"
          echo "release=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "backend=${BACKEND_VERSION}" >> "$GITHUB_OUTPUT"
          echo "통합 릴리스 ${RELEASE_VERSION} / 백엔드 ${BACKEND_VERSION} / 커밋 ${GITHUB_SHA}"

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: JAR 빌드 (네이티브)
        working-directory: backend
        run: ./gradlew bootJar -x test --no-daemon

      - name: QEMU 설정 (크로스 아키텍처 빌드용)
        uses: docker/setup-qemu-action@v3

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:dev-latest
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.release }}
            BACKEND_VERSION=${{ steps.version.outputs.backend }}
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: dev 서버 배포
    needs: build
    # dev 러너에만 명시적으로 보낸다 (prod 러너와 섞이지 않도록).
    runs-on: [self-hosted, linux, ARM64, dev]
    environment: development

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 최초 포트 인계는 서버에서 검증 후 수행한다. CD가 호스트 서비스를 임의 중지하지 않는다.
      - name: 호스트 Nginx 전환 완료 확인
        run: |
          set -eu
          if systemctl is-active --quiet nginx || systemctl is-enabled --quiet nginx; then
            echo "::error::호스트 Nginx가 활성화돼 있습니다. Docker 전환 검증 후 호스트 서비스를 중지·비활성화하세요."
            exit 1
          fi

      - name: 배치 전 지표 포트 사설 IP 확인
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          PRIVATE_IP=$(python3 -B backend/monitoring/check-private-ip.py dev "$DEPLOY_PATH")
          echo "MONITORING_PRIVATE_IP=$PRIVATE_IP" >> "$GITHUB_ENV"

      # 검증은 체크아웃 폴더에서 실행하므로 app.env_file 경로만 빈 파일로 준비한다.
      # DEPLOY_PATH의 실제 서버 .env는 변경하지 않는다.
      - name: Compose 검증용 앱 환경 파일 준비
        run: touch backend/.env

      - name: 배치 전 Alloy 설정 검증
        run: bash backend/monitoring/validate-alloy.sh dev

      - name: compose 파일 배치
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          mkdir -p "$DEPLOY_PATH/monitoring/alloy" "$DEPLOY_PATH/nginx" "$DEPLOY_PATH/deploy"
          cp backend/docker-compose.dev.yml "$DEPLOY_PATH/docker-compose.dev.yml"
          # 운영 nginx.conf 와 같은 구조다. 환경 라벨과 중앙 IP 두 값만 치환해 default.conf 로 둔다.
          # 활성 칸을 담은 nginx/upstream.conf 는 배포 스크립트가 관리하므로 덮어쓰지 않는다.
          sed -e 's/${SSSOK_ENVIRONMENT}/dev/g' -e 's/${CENTRAL_PRIVATE_IP}/10.0.20.204/g' \
            backend/monitoring/nginx/container/default.conf.template > "$DEPLOY_PATH/nginx/default.conf"
          cp backend/deploy/blue-green.sh "$DEPLOY_PATH/deploy/blue-green.sh"
          cp backend/monitoring/check-dev-node.sh "$DEPLOY_PATH/monitoring/check-dev-node.sh"
          cp backend/monitoring/alloy/config.alloy "$DEPLOY_PATH/monitoring/alloy/config.alloy"
          cp backend/monitoring/alloy/write.central.alloy "$DEPLOY_PATH/monitoring/alloy/write.central.alloy"

      - name: 블루-그린 배포
        env:
          NEW_IMAGE: ${{ needs.build.outputs.image }}
          APP_RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          APP_BACKEND_VERSION: ${{ needs.build.outputs.backend-version }}
          APP_GIT_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          cd "$DEPLOY_PATH"
          # 이 배포에만 쓰는 docker 설정에 로그인한다. 배포 스크립트(compose pull)도 같은 인증을 쓴다.
          DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/ghcr.XXXXXXXX")"
          export DOCKER_CONFIG
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s\n' '{"auths":{"ghcr.io":{}}}' > "$DOCKER_CONFIG/config.json"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          COMPOSE="docker compose --env-file .env --env-file blue.env --env-file green.env -f docker-compose.dev.yml"

          # 운영과 같은 스크립트·흐름이다. 새 이미지를 쉬는 칸에 띄워 readiness 를 확인한 뒤 nginx 를
          # 전환하고 기존 칸을 끈다. 어느 단계에서 실패해도 트래픽은 기존 칸에 남거나 되돌려지고, 잡은 실패로 끝난다.
          DEPLOY_ENV=dev bash deploy/blue-green.sh deploy

          # 외부 요청과 같은 Host 로 nginx(:80)를 거쳐 확인한다.
          curl --noproxy '*' -fsS --max-time 5 --retry 10 --retry-delay 2 --retry-all-errors \
            -H 'Host: dev-api.ssssok.com' http://127.0.0.1/health > /dev/null

          # 파일 복사만으로는 Alloy가 새 설정을 읽지 않는다. 실행 중인 버전으로 다시 검사하고
          # 내부 HTTP reload 응답을 확인한다. 수집 위치 볼륨과 컨테이너는 유지한다.
          $COMPOSE exec -T alloy /bin/alloy validate /etc/alloy/config
          $COMPOSE exec -T nginx wget -q -T 10 -O - --post-data='' http://alloy:12345/-/reload

          # 중앙 연결 설정이 다음 앱 배포에서 사라지는 것을 탐지한다.
          # 실패 시 배포를 실패로 보고하되, 헬스체크를 통과한 앱은 롤백하지 않는다.
          bash monitoring/check-dev-node.sh

          # 개발 출발지에서 중앙 Loki가 로그를 수락하는지 확인한다.
          CENTRAL_URL=$($COMPOSE exec -T alloy printenv CENTRAL_LOKI_URL)
          payload=$(printf '{"streams":[{"stream":{"environment":"dev","service":"monitoring-deploy"},"values":[["%s","dev central deployment probe"]]}]}' "$(date +%s%N)")
          status=$(curl --noproxy '*' --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' --data "$payload" -o /dev/null -w '%{http_code}' "$CENTRAL_URL")
          [ "$status" = 204 ] || { echo "중앙 Loki 수신 검사 실패: HTTP $status"; exit 1; }
