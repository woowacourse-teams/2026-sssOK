name: Backend Dev Deploy

on:
  push:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-dev-deploy
  cancel-in-progress: false

jobs:
  build:
    name: 이미지 빌드 및 푸시
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      release-version: ${{ steps.version.outputs.release }}
      backend-version: ${{ steps.version.outputs.backend }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: meta
        run: |
          # GHCR 은 소문자 경로만 허용한다. dev는 릴리즈 태그가 없으니 커밋 해시로만 식별한다.
          REPO_LOWER=$(echo "ghcr.io/${GITHUB_REPOSITORY}/backend" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "image=${REPO_LOWER}:dev-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 버전 정보 읽기
        id: version
        run: |
          set -eu
          RELEASE_VERSION="$(tr -d ' \t\r\n' < VERSION)"
          BACKEND_VERSION="$(sed -n 's/^version=//p' backend/gradle.properties | tail -n 1 | tr -d ' \t\r')"
          echo "release=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "backend=${BACKEND_VERSION}" >> "$GITHUB_OUTPUT"
          echo "통합 릴리스 ${RELEASE_VERSION} / 백엔드 ${BACKEND_VERSION} / 커밋 ${GITHUB_SHA}"

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: JAR 빌드 (네이티브)
        working-directory: backend
        run: ./gradlew bootJar -x test --no-daemon

      - name: QEMU 설정 (크로스 아키텍처 빌드용)
        uses: docker/setup-qemu-action@v3

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:dev-latest
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.release }}
            BACKEND_VERSION=${{ steps.version.outputs.backend }}
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: dev 서버 배포
    needs: build
    # dev 러너에만 명시적으로 보낸다 (prod 러너와 섞이지 않도록).
    runs-on: [self-hosted, linux, ARM64, dev]
    environment: development

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: compose 파일 배치
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL" || { echo "DISCORD_WEBHOOK_URL secret is required"; exit 1; }
          mkdir -p "$DEPLOY_PATH/monitoring/prometheus"
          mkdir -p "$DEPLOY_PATH/monitoring/prometheus/rules"
          mkdir -p "$DEPLOY_PATH/monitoring/alertmanager"
          mkdir -p "$DEPLOY_PATH/monitoring/grafana/provisioning/datasources"
          mkdir -p "$DEPLOY_PATH/monitoring/grafana/provisioning/dashboards"
          mkdir -p "$DEPLOY_PATH/monitoring/grafana/dashboards"
          mkdir -p "$DEPLOY_PATH/monitoring/loki"
          mkdir -p "$DEPLOY_PATH/monitoring/alloy"
          mkdir -p "$DEPLOY_PATH/secrets"
          cp backend/docker-compose.dev.yml "$DEPLOY_PATH/docker-compose.dev.yml"
          cp backend/monitoring/prometheus/prometheus.yml "$DEPLOY_PATH/monitoring/prometheus/prometheus.yml"
          cp backend/monitoring/prometheus/rules/backend-alerts.yml "$DEPLOY_PATH/monitoring/prometheus/rules/backend-alerts.yml"
          cp backend/monitoring/prometheus/rules/logging-alerts.yml "$DEPLOY_PATH/monitoring/prometheus/rules/logging-alerts.yml"
          cp backend/monitoring/prometheus/rules/host-alerts.yml "$DEPLOY_PATH/monitoring/prometheus/rules/host-alerts.yml"
          cp backend/monitoring/alertmanager/alertmanager.yml "$DEPLOY_PATH/monitoring/alertmanager/alertmanager.yml"
          cp backend/monitoring/grafana/provisioning/datasources/prometheus.yml "$DEPLOY_PATH/monitoring/grafana/provisioning/datasources/prometheus.yml"
          cp backend/monitoring/grafana/provisioning/datasources/loki.yml "$DEPLOY_PATH/monitoring/grafana/provisioning/datasources/loki.yml"
          cp backend/monitoring/grafana/provisioning/dashboards/dashboards.yml "$DEPLOY_PATH/monitoring/grafana/provisioning/dashboards/dashboards.yml"
          cp backend/monitoring/grafana/dashboards/backend-overview.json "$DEPLOY_PATH/monitoring/grafana/dashboards/backend-overview.json"
          cp backend/monitoring/grafana/dashboards/logs.json "$DEPLOY_PATH/monitoring/grafana/dashboards/logs.json"
          cp backend/monitoring/loki/loki.yml "$DEPLOY_PATH/monitoring/loki/loki.yml"
          cp backend/monitoring/alloy/config.alloy "$DEPLOY_PATH/monitoring/alloy/config.alloy"
          install -m 600 /dev/null "$DEPLOY_PATH/secrets/discord-webhook-url"
          printf '%s' "$DISCORD_WEBHOOK_URL" > "$DEPLOY_PATH/secrets/discord-webhook-url"

      - name: 이미지 교체 및 헬스체크
        env:
          NEW_IMAGE: ${{ needs.build.outputs.image }}
          APP_RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          APP_BACKEND_VERSION: ${{ needs.build.outputs.backend-version }}
          APP_GIT_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          cd "$DEPLOY_PATH"

          COMPOSE="docker compose --env-file .env --env-file image.env -f docker-compose.dev.yml"
          IMAGE_REPOSITORY="${NEW_IMAGE%:*}"

          check_monitoring_connections() {
            for i in $(seq 1 12); do
              PROMETHEUS_READY=false
              LOKI_READY=false

              if $COMPOSE exec -T grafana curl -fsS http://prometheus:9090/-/ready > /dev/null 2>&1; then
                PROMETHEUS_READY=true
              fi
              if $COMPOSE exec -T grafana curl -fsS http://loki:3100/ready > /dev/null 2>&1; then
                LOKI_READY=true
              fi

              if [ "$PROMETHEUS_READY" = true ] && [ "$LOKI_READY" = true ]; then
                echo "Grafana 데이터소스 연결 확인 성공 ($i번째 시도)"
                return 0
              fi

              echo "Grafana 데이터소스 연결 대기 ($i/12, prometheus=$PROMETHEUS_READY, loki=$LOKI_READY)"
              sleep 5
            done
            return 1
          }

          cleanup_old_images() {
            CURRENT_IMAGE="$(sed -n 's/^BACKEND_IMAGE=//p' image.env 2>/dev/null | tail -n 1)"
            PREVIOUS_IMAGE="$(sed -n 's/^BACKEND_IMAGE=//p' image.env.prev 2>/dev/null | tail -n 1)"

            echo "미사용 이전 이미지 정리 시작 (현재·직전 이미지는 보존)"
            docker image ls "$IMAGE_REPOSITORY" --format '{{.Repository}}:{{.Tag}}' |
              while IFS= read -r IMAGE; do
                [ "$IMAGE" = "$CURRENT_IMAGE" ] && continue
                [ "$IMAGE" = "$PREVIOUS_IMAGE" ] && continue
                [ "${IMAGE##*:}" = '<none>' ] && continue
                docker image rm "$IMAGE" || true
              done
            docker image prune -f > /dev/null 2>&1 || true
          }

          finish() {
            cleanup_old_images
            docker logout ghcr.io > /dev/null 2>&1 || true
          }
          trap finish EXIT

          # pull 전에 공간을 확보해 디스크 부족으로 배포가 시작조차 못 하는 상황을 막는다.
          cleanup_old_images

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # 롤백 대비로 직전 이미지 태그를 보관한다.
          if [ -f image.env ]; then
            cp image.env image.env.prev
          fi
          # 이미지와 버전을 한 파일에 같이 둔다 — 롤백으로 image.env.prev 를 되돌리면
          # 그 이미지가 실제로 배포됐을 때의 버전 정보도 같이 돌아간다.
          {
            echo "BACKEND_IMAGE=$NEW_IMAGE"
            echo "APP_RELEASE_VERSION=$APP_RELEASE_VERSION"
            echo "APP_BACKEND_VERSION=$APP_BACKEND_VERSION"
            echo "APP_GIT_SHA=$APP_GIT_SHA"
          } > image.env

          $COMPOSE pull
          $COMPOSE up -d
          # 모니터링 설정은 위에서 cp 로 덮어쓰기만 해서 컨테이너가 재생성되지 않는다. Prometheus(알림 규칙)와
          # Alertmanager 는 파일이 바뀌어도 스스로 다시 읽지 않으므로 SIGHUP 으로 다시 읽게 한다.
          # 리로드 실패가 앱 배포를 막지는 않게 한다.
          $COMPOSE kill -s SIGHUP prometheus alertmanager || echo "모니터링 설정 리로드 실패 - 수동으로 재시작 필요"

          echo "헬스체크 시작"
          # dev는 ALB/nginx 없이 인스턴스에 직접 붙으므로 8080을 바로 확인한다.
          APP_HEALTHY=false
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
              echo "헬스체크 성공 ($i번째 시도)"
              APP_HEALTHY=true
              break
            fi
            sleep 5
          done

          if [ "$APP_HEALTHY" != true ]; then
            echo "헬스체크 실패 - 직전 버전으로 롤백한다"
            $COMPOSE logs --tail 100 app || true

            if [ -f image.env.prev ]; then
              mv image.env.prev image.env
              $COMPOSE up -d
              echo "롤백 완료"
            else
              echo "직전 버전이 없어 롤백하지 못했다 (최초 배포로 추정)"
            fi

            exit 1
          fi

          echo "Grafana 데이터소스 연결 확인 시작"
          if ! check_monitoring_connections; then
            echo "연결 실패 - Prometheus, Loki, Grafana를 한 차례 재생성한다"
            $COMPOSE up -d --force-recreate prometheus loki grafana

            if ! check_monitoring_connections; then
              echo "재생성 후에도 Grafana 데이터소스 연결에 실패했다"
              $COMPOSE logs --tail 100 prometheus loki grafana || true
              exit 1
            fi
          fi
