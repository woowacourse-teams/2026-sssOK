name: Backend Version Check

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 검증할 PR 번호
        required: true
        type: string
  pull_request:
    branches: [ develop ]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-version-check-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  version-check:
    name: 백엔드 버전 검증
    runs-on: ubuntu-latest

    steps:
      - name: PR 커밋 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR 정보 읽기
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
            BASE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .base.sha)"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
            BASE_SHA="$EVENT_BASE_SHA"
            jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr-body.md"
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: 버전 증가 유형 읽기
        id: bump
        run: |
          BUMP="$(bash .github/scripts/read-backend-version-bump.sh "$RUNNER_TEMP/pr-body.md")"
          echo "value=$BUMP" >> "$GITHUB_OUTPUT"

      - name: 변경 경로와 버전 검증
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          BUMP: ${{ steps.bump.outputs.value }}
        run: |
          git show "$BASE_SHA:backend/gradle.properties" > "$RUNNER_TEMP/base-gradle.properties"
          BACKEND_CHANGED=false
          if git diff --quiet "$BASE_SHA" HEAD -- backend/ ':!backend/gradle.properties'; then
            echo "백엔드 애플리케이션 변경 없음"
          else
            BACKEND_CHANGED=true
            echo "백엔드 애플리케이션 변경 감지"
          fi

          if [ "$BACKEND_CHANGED" = true ] && [ "$BUMP" = none ]; then
            echo "::error::backend/ 변경이 있으므로 MAJOR, MINOR, PATCH 중 하나를 선택해야 한다."
            exit 1
          fi
          if [ "$BACKEND_CHANGED" = false ] && [ "$BUMP" != none ]; then
            echo "::error::backend/ 변경이 없으므로 '변경 없음'을 선택해야 한다."
            exit 1
          fi

          bash .github/scripts/backend-version.sh check \
            "$RUNNER_TEMP/base-gradle.properties" backend/gradle.properties "$BUMP"
