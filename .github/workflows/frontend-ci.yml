name: Frontend CI

on:
  pull_request:
    branches: [main, deploy]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

# pr에 새로운 커밋 올라올 시 이전 작업 취소
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: 프론트엔드 검증
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          # 직전 릴리스 태그와 비교해야 하므로 얕은 클론으로는 부족하다.
          fetch-depth: 0

      # 배포 PR에서만 검사한다. 버전은 사람이 직접 올리고, 여기서는 올렸는지만 확인한다.
      # 의존성 설치보다 앞에 둬서 빠뜨렸을 때 빌드까지 가지 않고 끝나게 한다.
      - name: 버전 상승 확인
        if: github.base_ref == 'deploy'
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          LAST=$(git tag -l 'fe-v*' --sort=-v:refname | head -1 | sed 's/^fe-v//')
          if [ "$CURRENT" = "$LAST" ]; then
            echo "::error::프론트 버전이 $LAST 그대로다. package.json 의 version 을 올려야 한다."
            exit 1
          fi
          echo "${LAST:-없음} -> $CURRENT"

      - name: pnpm 설정
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 코드 포맷 검사
        run: pnpm format:check

      - name: ESLint 검사
        run: pnpm lint

      - name: 테스트
        run: pnpm test --ci

      - name: 타입 검사 및 프로덕션 빌드
        run: pnpm build
