name: Frontend CI

on:
  pull_request:
    branches: [main, deploy]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

# pr에 새로운 커밋 올라올 시 이전 작업 취소
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: 프론트엔드 검증
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설정
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 코드 포맷 검사
        run: pnpm format:check

      - name: ESLint 검사
        run: pnpm lint

      - name: 테스트
        run: pnpm test --ci

      - name: 타입 검사 및 프로덕션 빌드
        run: pnpm build
