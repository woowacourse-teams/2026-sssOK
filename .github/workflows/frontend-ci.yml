name: Frontend CI

on:
  pull_request:
    branches: [main, develop, deploy]

permissions:
  contents: read
  pull-requests: read

# pr에 새로운 커밋 올라올 시 이전 작업 취소
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: 변경 경로 확인
    runs-on: ubuntu-latest
    outputs:
      # frontend/** 가 안 바뀐 PR은 검증을 건너뛴다. paths 필터를 워크플로우 트리거가 아니라
      # 여기서 거는 이유: 트리거에 걸면 워크플로우 자체가 안 돌아서, "프론트엔드 검증"을 브랜치
      # 보호 규칙의 필수 체크로 걸었을 때 그 PR은 체크가 영영 안 생겨 머지가 막혀버린다.
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: 경로 필터
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'

  frontend-ci:
    name: 프론트엔드 검증
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          # 직전 릴리스 태그와 비교해야 하므로 얕은 클론으로는 부족하다.
          fetch-depth: 0

      # 배포 PR에서만 검사한다. 버전은 사람이 직접 올리고, 여기서는 올렸는지만 확인한다.
      # 의존성 설치보다 앞에 둬서 빠뜨렸을 때 빌드까지 가지 않고 끝나게 한다.
      - name: 버전 상승 확인
        if: github.base_ref == 'deploy'
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          LAST=$(git tag -l 'fe-v*' --sort=-v:refname | head -1 | sed 's/^fe-v//')
          if [ "$CURRENT" = "$LAST" ]; then
            echo "::error::프론트 버전이 $LAST 그대로다. package.json 의 version 을 올려야 한다."
            exit 1
          fi
          echo "${LAST:-없음} -> $CURRENT"

      - name: pnpm 설정
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 코드 포맷 검사
        run: pnpm format:check

      - name: ESLint 검사
        run: pnpm lint

      - name: 테스트
        run: pnpm test --ci

      - name: 타입 검사 및 프로덕션 빌드
        run: pnpm build

  ci-ok:
    name: 프론트엔드 CI 결과
    needs: [ changes, frontend-ci ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # frontend-ci가 스킵됐으면(frontend 미변경) 통과로 본다. 브랜치 보호 규칙의 필수 체크는
      # 이 job("프론트엔드 CI 결과")을 지정한다 — frontend-ci 자체를 지정하면 스킵된 PR에서
      # 체크가 안 생겨 머지가 막힌다.
      - name: 결과 판정
        run: |
          if [ "${{ needs.frontend-ci.result }}" = "failure" ]; then
            echo "::error::프론트엔드 검증 실패"
            exit 1
          fi
          echo "통과 (frontend 변경 여부: ${{ needs.changes.outputs.frontend }}, 결과: ${{ needs.frontend-ci.result }})"
