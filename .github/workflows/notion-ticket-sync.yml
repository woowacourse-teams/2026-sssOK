name: Notion Ticket 동기화

# GitHub Issue 를 Notion Ticket DB 에 반영한다. Issue 1개 = Ticket 1개.
# 담당자·라벨·상태가 바뀔 때마다 같은 Ticket 페이지를 갱신하며 새 페이지를 만들지 않는다.
on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed
      - assigned
      - unassigned
      - labeled
      - unlabeled
  # 동기화가 어긋났을 때 특정 이슈를 골라 다시 밀어 넣는다.
  workflow_dispatch:
    inputs:
      issue_number:
        description: '다시 동기화할 이슈 번호'
        required: true
        type: number

permissions:
  contents: read
  issues: read

# 같은 이슈에 대한 실행은 하나씩만 돌린다. 라벨을 연달아 바꿀 때 두 실행이 겹쳐
# 같은 티켓을 각자 만들어버리는 경합을 막는다.
concurrency:
  group: notion-ticket-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  sync:
    name: Ticket 반영
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # workflow_dispatch 로 돌릴 때는 이벤트 페이로드에 issue 가 없으므로,
      # 지정한 번호로 이슈를 조회해 같은 모양의 페이로드를 만들어 준다.
      - name: 수동 실행용 이슈 페이로드 준비
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ inputs.issue_number }}" \
            --jq '{issue: .}' > "${RUNNER_TEMP}/issue-event.json"
          echo "EVENT_PATH_OVERRIDE=${RUNNER_TEMP}/issue-event.json" >> "$GITHUB_ENV"

      - name: Notion Ticket 동기화
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TICKET_DB_ID: ${{ secrets.NOTION_TICKET_DB_ID }}
          NOTION_PLAYER_DB_ID: ${{ secrets.NOTION_PLAYER_DB_ID }}
          GITHUB_EVENT_PATH: ${{ env.EVENT_PATH_OVERRIDE || github.event_path }}
        run: node .github/scripts/notion-ticket-sync.mjs
