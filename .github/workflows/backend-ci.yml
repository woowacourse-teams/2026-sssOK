name: Backend CI

on:
  # GitHub 쪽 일시적 오류로 실행이 시작되지 못하면 수동으로 다시 돌린다.
  workflow_dispatch:
  pull_request:
    branches: [ main, develop, deploy ]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: 변경 경로 확인
    runs-on: ubuntu-latest
    outputs:
      # backend/** 가 안 바뀐 PR은 build를 건너뛴다. paths 필터를 워크플로우 트리거가 아니라
      # 여기서 거는 이유: 트리거에 걸면 워크플로우 자체가 안 돌아서, "빌드 및 테스트"를 브랜치
      # 보호 규칙의 필수 체크로 걸었을 때 그 PR은 체크가 영영 안 생겨 머지가 막혀버린다.
      # workflow_dispatch(수동 재실행)는 경로와 무관하게 항상 backend=true로 취급한다.
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
    steps:
      - name: 경로 필터
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/backend-version-intents/**'
              - '.github/scripts/*backend-version*.sh'
              - '.github/workflows/backend-ci.yml'

  version-check:
    name: 백엔드 버전 검증
    # 작업·릴리스 준비 PR이 모이는 develop에서만 의도 파일 규칙을 검사한다.
    # main/deploy 승격 PR은 release-check.yml이 직전 운영 태그 기준으로 최종 검증한다.
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 작업·릴리스 버전 규칙 검증
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/check-backend-version-pr.sh "$BASE_SHA"

  build:
    name: 빌드 및 테스트
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      # 영상 썸네일 추출기 테스트가 실물 ffmpeg 로 돈다. 없으면 그 테스트들이 조용히
      # 건너뛰어져, 깨진 채로 머지돼도 CI 가 초록으로 통과한다.
      # 운영 이미지에도 같은 패키지가 깔린다(backend/Dockerfile).
      - name: ffmpeg 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          # 설치가 조용히 실패하면 여기서 잡는다 — 테스트 스킵으로 흘러가지 않게 한다.
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: 빌드 및 테스트
        run: ./gradlew build
        env:
          # CI 테스트 전용 키. 운영 시크릿과 무관하며 실제 배포에는 쓰이지 않는다.
          JWT_SECRET: 5SWYqRqL3JIuYo1c/ecWhbU6RTRd2nWPQfeaDjGJSd0=
          # application-local.yml은 gitignore 대상이라 CI에는 없다. 로컬 기본값과 맞춰
          # WebMvcTest(별도 @ActiveProfiles("test") 없이 도는 슬라이스)의 CORS 테스트가 통과하게 한다.
          CORS_ALLOWED_ORIGINS: http://localhost:3000

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  ci-ok:
    name: 백엔드 CI 결과
    needs: [ changes, version-check, build ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # build가 스킵됐으면(backend 미변경) 통과로 본다. 브랜치 보호 규칙의 필수 체크는
      # 이 job("백엔드 CI 결과")을 지정한다 — build 자체를 지정하면 스킵된 PR에서 체크가
      # 안 생겨 머지가 막힌다.
      - name: 결과 판정
        run: |
          if [ "${{ needs.build.result }}" = "failure" ] || \
             { [ "${{ needs.version-check.result }}" != "success" ] && [ "${{ needs.version-check.result }}" != "skipped" ]; }; then
            echo "::error::백엔드 빌드/테스트 실패"
            exit 1
          fi
          echo "통과 (backend 변경 여부: ${{ needs.changes.outputs.backend }}, 버전 검증: ${{ needs.version-check.result }}, build 결과: ${{ needs.build.result }})"
