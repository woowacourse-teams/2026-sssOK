name: Backend Prod Deploy

on:
  push:
    branches: [ deploy ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-prod.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  build:
    name: 이미지 빌드 및 푸시
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      release-version: ${{ steps.version.outputs.release }}
      backend-version: ${{ steps.version.outputs.backend }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: meta
        run: |
          # GHCR 은 소문자 경로만 허용한다.
          REPO_LOWER=$(echo "ghcr.io/${GITHUB_REPOSITORY}/backend" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "image=${REPO_LOWER}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 버전 정보 읽기
        id: version
        run: |
          set -eu
          RELEASE_VERSION="$(tr -d ' \t\r\n' < VERSION)"
          BACKEND_VERSION="$(sed -n 's/^version=//p' backend/gradle.properties | tail -n 1 | tr -d ' \t\r')"
          echo "release=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "backend=${BACKEND_VERSION}" >> "$GITHUB_OUTPUT"
          echo "통합 릴리스 ${RELEASE_VERSION} / 백엔드 ${BACKEND_VERSION} / 커밋 ${GITHUB_SHA}"

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: JAR 빌드 (네이티브)
        # 컴파일은 러너에서 amd64 네이티브로 끝내고, Docker는 결과물만 담는다.
        # (이미지 안에서 컴파일하면 arm64 크로스 빌드 시 QEMU 에뮬레이션으로 수 배 느려진다)
        working-directory: backend
        run: ./gradlew bootJar -x test --no-daemon

      - name: QEMU 설정 (크로스 아키텍처 빌드용)
        uses: docker/setup-qemu-action@v3

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # 이미지 조립은 미리 빌드된 JAR을 복사만 하므로,
          # QEMU 에뮬레이션 비용 없이 두 아키텍처 모두 빠르게 빌드된다.
          platforms: linux/amd64,linux/arm64
          # 배포·롤백에는 변하지 않는 커밋 SHA 태그를 쓴다.
          # 버전 태그는 "지금 운영에 나간 게 어느 릴리스인지" 사람이 훑어보기 위한 별칭이다.
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:backend-v${{ steps.version.outputs.backend }}
            ${{ steps.meta.outputs.repo }}:release-v${{ steps.version.outputs.release }}
            ${{ steps.meta.outputs.repo }}:latest
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.release }}
            BACKEND_VERSION=${{ steps.version.outputs.backend }}
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 서버 배포
    needs: build
    # 러너 자체가 배포 대상 EC2 위에서 돈다 (self-hosted).
    # 그래서 SSH/SCP 없이 로컬 명령으로 바로 배포한다.
    # prod 러너가 여러 대(기존 인스턴스 → dev 전환 중, 신규 인스턴스)가 되는 과도기라
    # 'prod' 라벨로 신규 인스턴스를 명시적으로 지목한다.
    runs-on: [self-hosted, linux, ARM64, prod]
    environment: production

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: compose 파일 배치
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p "$DEPLOY_PATH"
          cp backend/docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.prod.yml"
          cp backend/nginx.conf "$DEPLOY_PATH/nginx.conf"

      - name: 이미지 교체 및 헬스체크
        env:
          NEW_IMAGE: ${{ needs.build.outputs.image }}
          APP_RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          APP_BACKEND_VERSION: ${{ needs.build.outputs.backend-version }}
          APP_GIT_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          cd "$DEPLOY_PATH"

          COMPOSE="docker compose --env-file .env --env-file image.env -f docker-compose.prod.yml"
          IMAGE_REPOSITORY="${NEW_IMAGE%:*}"

          cleanup_old_images() {
            CURRENT_IMAGE="$(sed -n 's/^BACKEND_IMAGE=//p' image.env 2>/dev/null | tail -n 1)"
            PREVIOUS_IMAGE="$(sed -n 's/^BACKEND_IMAGE=//p' image.env.prev 2>/dev/null | tail -n 1)"

            echo "미사용 이전 이미지 정리 시작 (현재·직전 이미지는 보존)"
            docker image ls "$IMAGE_REPOSITORY" --format '{{.Repository}}:{{.Tag}}' |
              while IFS= read -r IMAGE; do
                [ "$IMAGE" = "$CURRENT_IMAGE" ] && continue
                [ "$IMAGE" = "$PREVIOUS_IMAGE" ] && continue
                [ "${IMAGE##*:}" = '<none>' ] && continue
                docker image rm "$IMAGE" || true
              done
            docker image prune -f > /dev/null 2>&1 || true
          }

          finish() {
            cleanup_old_images
            docker logout ghcr.io > /dev/null 2>&1 || true
          }
          trap finish EXIT

          # pull 전에 공간을 확보해 디스크 부족으로 배포가 시작조차 못 하는 상황을 막는다.
          cleanup_old_images

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # 롤백 대비로 직전 이미지 태그를 보관한다.
          if [ -f image.env ]; then
            cp image.env image.env.prev
          fi
          # 이미지와 버전을 한 파일에 같이 둔다 — 롤백으로 image.env.prev 를 되돌리면
          # 그 이미지가 실제로 배포됐을 때의 버전 정보도 같이 돌아간다.
          {
            echo "BACKEND_IMAGE=$NEW_IMAGE"
            echo "APP_RELEASE_VERSION=$APP_RELEASE_VERSION"
            echo "APP_BACKEND_VERSION=$APP_BACKEND_VERSION"
            echo "APP_GIT_SHA=$APP_GIT_SHA"
          } > image.env

          $COMPOSE pull
          $COMPOSE up -d

          echo "헬스체크 시작"
          # 8080이 아니라 80(nginx)을 확인한다 — ALB가 실제로 타는 경로 그대로 검증한다.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/health > /dev/null 2>&1; then
              echo "헬스체크 성공 ($i번째 시도)"
              exit 0
            fi
            sleep 5
          done

          echo "헬스체크 실패 - 직전 버전으로 롤백한다"
          $COMPOSE logs --tail 100 app || true

          if [ -f image.env.prev ]; then
            mv image.env.prev image.env
            $COMPOSE up -d
            echo "롤백 완료"
          else
            echo "직전 버전이 없어 롤백하지 못했다 (최초 배포로 추정)"
          fi

          exit 1

  tag:
    name: 릴리스 태그 생성
    needs: deploy
    # 운영 헬스체크까지 성공한 뒤에만 찍는다. 배포가 실패하면 그 버전의 성공 태그는 남지 않는다.
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          # 직전 릴리스 태그와 비교해야 하므로 얕은 클론으로는 부족하다.
          fetch-depth: 0

      - name: 태그 및 릴리스 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          RELEASE_VERSION="$(tr -d ' \t\r\n' < VERSION)"
          BACKEND_VERSION="$(sed -n 's/^version=//p' backend/gradle.properties | tail -n 1 | tr -d ' \t\r')"
          FRONTEND_VERSION="$(node -p "require('./frontend/package.json').version")"
          RELEASE_TAG="release-v${RELEASE_VERSION}"

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" > /dev/null; then
            echo "::notice::${RELEASE_TAG} 가 이미 있다. 버전을 올리지 않은 재배포로 보고 태그 생성을 건너뛴다."
            exit 0
          fi

          # 직전 통합 릴리스 이후 실제로 바뀐 서비스에만 서비스 태그를 새로 만든다.
          # 첫 릴리스라 비교 대상이 없으면 양쪽 모두 만든다.
          PREVIOUS_RELEASE="$(git tag -l 'release-v*' --sort=-v:refname | head -1)"
          changed() {
            [ -z "$PREVIOUS_RELEASE" ] && return 0
            ! git diff --quiet "$PREVIOUS_RELEASE" "$GITHUB_SHA" -- "$1"
          }

          TAGS="$RELEASE_TAG"
          changed backend/ && TAGS="$TAGS backend-v${BACKEND_VERSION}"
          changed frontend/ && TAGS="$TAGS frontend-v${FRONTEND_VERSION}"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          for TAG in $TAGS; do
            if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
              echo "::notice::${TAG} 가 이미 있어 건너뛴다."
              continue
            fi
            git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            echo "$TAG 생성"
          done

          {
            echo "통합 릴리스: ${RELEASE_VERSION}"
            echo "프론트엔드: ${FRONTEND_VERSION}"
            echo "백엔드: ${BACKEND_VERSION}"
            echo "배포 커밋: ${GITHUB_SHA}"
          } > release-notes.md

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md
