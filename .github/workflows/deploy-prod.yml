name: PROD runner check
on: workflow_dispatch
permissions: {}
jobs:
  check:
    runs-on: [self-hosted, linux, ARM64, prod]
    timeout-minutes: 2
    steps:
      - name: Verify runner, instance and backend health
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner %s\n' "$RUNNER_NAME"
          test "$RUNNER_NAME" = sssok-prod-new-runner
          token=$(curl -fsS --max-time 3 --noproxy '*' -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)
          instance=$(curl -fsS --max-time 3 --noproxy '*' -H "X-aws-ec2-metadata-token: $token" http://169.254.169.254/latest/meta-data/instance-id)
          printf 'Instance %s\n' "$instance"
          test "$instance" = i-068dca5e201aa1a53
          state=$(docker inspect --format '{{.State.Health.Status}}' sssok-app)
          status=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/health)
          printf 'Container %s, HTTP %s\n' "$state" "$status"
          test "$state" = healthy
          test "$status" = 200
