name: Backend Prod Deploy

on:
  push:
    branches: [ deploy ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-prod.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  build:
    name: 이미지 빌드 및 푸시
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      repo: ${{ steps.meta.outputs.repo }}
      release-version: ${{ steps.version.outputs.release }}
      backend-version: ${{ steps.version.outputs.backend }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: meta
        run: |
          # GHCR 은 소문자 경로만 허용한다.
          REPO_LOWER=$(echo "ghcr.io/${GITHUB_REPOSITORY}/backend" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "image=${REPO_LOWER}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 버전 정보 읽기
        id: version
        run: |
          set -eu
          RELEASE_VERSION="$(tr -d ' \t\r\n' < VERSION)"
          BACKEND_VERSION="$(sed -n 's/^version=//p' backend/gradle.properties | tail -n 1 | tr -d ' \t\r')"
          echo "release=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "backend=${BACKEND_VERSION}" >> "$GITHUB_OUTPUT"
          echo "통합 릴리스 ${RELEASE_VERSION} / 백엔드 ${BACKEND_VERSION} / 커밋 ${GITHUB_SHA}"

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: JAR 빌드 (네이티브)
        # 컴파일은 러너에서 amd64 네이티브로 끝내고, Docker는 결과물만 담는다.
        # (이미지 안에서 컴파일하면 arm64 크로스 빌드 시 QEMU 에뮬레이션으로 수 배 느려진다)
        working-directory: backend
        run: ./gradlew bootJar -x test --no-daemon

      - name: QEMU 설정 (크로스 아키텍처 빌드용)
        uses: docker/setup-qemu-action@v3

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # 이미지 조립은 미리 빌드된 JAR을 복사만 하므로,
          # QEMU 에뮬레이션 비용 없이 두 아키텍처 모두 빠르게 빌드된다.
          platforms: linux/amd64,linux/arm64
          # 여기서는 변하지 않는 커밋 SHA 태그만 올린다.
          # backend-v*·release-v*·latest 는 "지금 운영에 나가 있는 이미지"를 가리키는 별칭이라,
          # 헬스체크가 성공한 뒤 별도 잡에서 붙인다 — 배포가 실패해 롤백됐는데 별칭만 새 이미지를
          # 가리키면 레지스트리가 운영 상태를 잘못 알려주게 된다.
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.release }}
            BACKEND_VERSION=${{ steps.version.outputs.backend }}
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 서버 배포
    needs: build
    # 러너 자체가 배포 대상 EC2 위에서 돈다 (self-hosted).
    # 그래서 SSH/SCP 없이 로컬 명령으로 바로 배포한다.
    # prod 러너가 여러 대(기존 인스턴스 → dev 전환 중, 신규 인스턴스)가 되는 과도기라
    # 'prod' 라벨로 신규 인스턴스를 명시적으로 지목한다.
    runs-on: [self-hosted, linux, ARM64, prod]
    environment: production

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 배치 전 지표 포트 사설 IP 확인
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          PRIVATE_IP=$(python3 -B backend/monitoring/check-private-ip.py prod "$DEPLOY_PATH")
          echo "MONITORING_PRIVATE_IP=$PRIVATE_IP" >> "$GITHUB_ENV"

      # 검증은 체크아웃 폴더에서 실행하므로 app.env_file 경로만 빈 파일로 준비한다.
      # DEPLOY_PATH의 실제 서버 .env는 변경하지 않는다.
      - name: Compose 검증용 앱 환경 파일 준비
        run: touch backend/.env

      - name: 배치 전 Alloy 설정 검증
        run: bash backend/monitoring/validate-alloy.sh prod

      - name: compose 파일 배치
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          mkdir -p "$DEPLOY_PATH/monitoring/alloy" "$DEPLOY_PATH/nginx" "$DEPLOY_PATH/deploy"
          cp backend/docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.prod.yml"
          # 활성 칸을 담은 nginx/upstream.conf 는 배포 스크립트가 관리하므로 덮어쓰지 않는다.
          cp backend/nginx.conf "$DEPLOY_PATH/nginx/default.conf"
          cp backend/deploy/blue-green.sh "$DEPLOY_PATH/deploy/blue-green.sh"
          cp backend/monitoring/check-prod-node.sh "$DEPLOY_PATH/monitoring/check-prod-node.sh"
          cp backend/monitoring/alloy/config.alloy "$DEPLOY_PATH/monitoring/alloy/config.alloy"
          cp backend/monitoring/alloy/write.central.alloy "$DEPLOY_PATH/monitoring/alloy/write.central.alloy"

      - name: 블루-그린 배포
        env:
          NEW_IMAGE: ${{ needs.build.outputs.image }}
          APP_RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          APP_BACKEND_VERSION: ${{ needs.build.outputs.backend-version }}
          APP_GIT_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          cd "$DEPLOY_PATH"
          # 신규 러너의 기본 credential helper 대신 이 배포에만 사용하는 설정에 로그인한다.
          # 배포 스크립트(compose pull)도 이 DOCKER_CONFIG 를 물려받아 같은 인증으로 이미지를 받는다.
          DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/ghcr.XXXXXXXX")"
          export DOCKER_CONFIG
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s\n' '{"auths":{"ghcr.io":{}}}' > "$DOCKER_CONFIG/config.json"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          COMPOSE="docker compose --env-file .env --env-file blue.env --env-file green.env -f docker-compose.prod.yml"

          # 새 이미지를 쉬는 칸에 띄워 readiness 를 확인한 뒤 nginx 를 전환하고 기존 칸을 끈다.
          # 어느 단계에서 실패해도 트래픽은 기존 칸에 남거나 되돌려지고, 잡은 실패로 끝난다.
          bash deploy/blue-green.sh deploy

          # 로컬 수집기를 검사한다. 중앙 연결 실패와 앱 롤백은 분리한다.
          $COMPOSE exec -T alloy /bin/alloy validate /etc/alloy/config
          $COMPOSE exec -T nginx wget -q -T 10 -O - --post-data='' http://alloy:12345/-/reload

          # 실패 시 정상 앱을 롤백하지 않고 배포 실패로 보고한다.
          bash monitoring/check-prod-node.sh

      - name: 중앙 Loki 수신 확인 (앱 배포와 별도)
        # 중앙 장애 때문에 정상 앱의 배포 결과·버전 태그를 되돌리지 않는다.
        continue-on-error: true
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          cd "$DEPLOY_PATH"
          CENTRAL_URL=$(docker compose --env-file .env --env-file blue.env --env-file green.env -f docker-compose.prod.yml exec -T alloy printenv CENTRAL_LOKI_URL)
          payload=$(printf '{"streams":[{"stream":{"environment":"prod","service":"monitoring-deploy"},"values":[["%s","prod central deployment probe"]]}]}' "$(date +%s%N)")
          if ! status=$(curl --noproxy '*' --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' --data "$payload" -o /dev/null -w '%{http_code}' "$CENTRAL_URL"); then
            echo '::warning::중앙 Loki 연결 실패. 앱 배포는 유지하며 중앙 수신 상태를 별도로 확인하세요.'
            exit 1
          fi
          if [ "$status" != 204 ]; then
            echo "::warning::중앙 Loki 수신 실패: HTTP $status. 앱 배포는 유지합니다."
            exit 1
          fi
          echo '중앙 Loki 시험 로그 수신 확인 (실제 Alloy 로그 전송·조회는 별도 검증)'

  alias:
    name: 이미지 버전 별칭 발행
    needs: [ build, deploy ]
    # 헬스체크까지 성공한 이미지에만 별칭을 옮긴다. 배포가 실패해 롤백되면 별칭은 직전 이미지에
    # 그대로 남아, 레지스트리가 실제 운영 상태와 어긋나지 않는다.
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 별칭 태그 붙이기
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          REPO: ${{ needs.build.outputs.repo }}
          RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
          BACKEND_VERSION: ${{ needs.build.outputs.backend-version }}
        run: |
          set -eu
          # 이미지를 다시 빌드하거나 받지 않고 레지스트리의 매니페스트에 이름만 더 붙인다.
          # (imagetools 는 멀티아키 매니페스트 리스트를 그대로 보존한다)
          docker buildx imagetools create \
            --tag "${REPO}:backend-v${BACKEND_VERSION}" \
            --tag "${REPO}:release-v${RELEASE_VERSION}" \
            --tag "${REPO}:latest" \
            "$IMAGE"
          echo "별칭 발행 완료: backend-v${BACKEND_VERSION}, release-v${RELEASE_VERSION}, latest -> ${IMAGE}"

  tag:
    name: 릴리스 태그 생성
    needs: deploy
    # 운영 헬스체크까지 성공한 뒤에만 찍는다. 배포가 실패하면 그 버전의 성공 태그는 남지 않는다.
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          # 직전 릴리스 태그와 비교해야 하므로 얕은 클론으로는 부족하다.
          fetch-depth: 0

      - name: 태그 및 릴리스 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          RELEASE_VERSION="$(tr -d ' \t\r\n' < VERSION)"
          BACKEND_VERSION="$(sed -n 's/^version=//p' backend/gradle.properties | tail -n 1 | tr -d ' \t\r')"
          FRONTEND_VERSION="$(node -p "require('./frontend/package.json').version")"
          RELEASE_TAG="release-v${RELEASE_VERSION}"

          # 직전 통합 릴리스 이후 실제로 바뀐 서비스에만 서비스 태그를 만든다.
          # 이번 릴리스 태그 자신은 비교 대상에서 뺀다 — 일부만 만들어진 채 실패한 뒤 재실행하면
          # 자기 자신이 "직전 릴리스"로 잡혀 변경 없음으로 오판하게 된다.
          PREVIOUS_RELEASE="$(git tag -l 'release-v*' --sort=-v:refname | grep -vx "$RELEASE_TAG" | head -1 || true)"
          changed() {
            [ -z "$PREVIOUS_RELEASE" ] && return 0
            ! git diff --quiet "$PREVIOUS_RELEASE" "$GITHUB_SHA" -- "$1"
          }

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # 이미 있으면 이번 배포 커밋을 가리키는지 확인하고, 없을 때만 만든다.
          # 태그·릴리스를 각각 판정하므로 일부만 만들어진 상태에서 재실행하면 나머지가 채워진다.
          MISMATCH=0
          ensure_tag() {
            TAG="$1"
            if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
              TAGGED_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
              if [ "$TAGGED_SHA" != "$GITHUB_SHA" ]; then
                echo "::error::${TAG} 가 이번 배포 커밋이 아니라 ${TAGGED_SHA} 를 가리킨다. 버전을 올리지 않고 배포했을 가능성이 높다."
                MISMATCH=1
                return
              fi
              echo "${TAG}: 이미 이번 배포 커밋을 가리킨다"
              return
            fi
            git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            echo "${TAG}: 생성"
          }

          ensure_tag "$RELEASE_TAG"
          changed backend/ && ensure_tag "backend-v${BACKEND_VERSION}"
          changed frontend/ && ensure_tag "frontend-v${FRONTEND_VERSION}"

          if [ "$MISMATCH" -ne 0 ]; then
            echo "::error::태그가 이번 배포 커밋과 어긋나 릴리스 생성을 중단한다. 루트 VERSION 을 올렸는지 확인한다."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "${RELEASE_TAG}: 릴리스가 이미 있다"
            exit 0
          fi

          {
            echo "통합 릴리스: ${RELEASE_VERSION}"
            echo "프론트엔드: ${FRONTEND_VERSION}"
            echo "백엔드: ${BACKEND_VERSION}"
            echo "배포 커밋: ${GITHUB_SHA}"
            echo
            bash .github/scripts/release-notes.sh "$PREVIOUS_RELEASE" "$GITHUB_SHA"
          } > release-notes.md

          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          echo "${RELEASE_TAG}: 릴리스 생성"
