name: Gallery MCP Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gallery-mcp-deploy
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/mcp-ci.yml
  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Image repository
        id: repository
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}/gallery-mcp" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: mcp/servers/gallery
          platforms: linux/arm64
          push: true
          tags: ${{ steps.repository.outputs.value }}:${{ github.sha }}
          cache-from: type=gha,scope=gallery-mcp
          cache-to: type=gha,mode=max,scope=gallery-mcp
      - name: Immutable image reference
        id: image
        env:
          REPOSITORY: ${{ steps.repository.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "value=$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    needs: build
    runs-on: [self-hosted, linux, ARM64, mcp]
    environment: mcp
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolated registry credentials
        run: |
          config=$(mktemp -d)
          echo "DOCKER_CONFIG=$config" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy and verify
        env:
          GALLERY_IMAGE: ${{ needs.build.outputs.image }}
        run: bash mcp/deployment/deploy.sh
      - name: Remove temporary registry credentials
        if: always()
        run: |
          if [ -n "${DOCKER_CONFIG:-}" ]; then
            rm -f "$DOCKER_CONFIG/config.json"
            rmdir "$DOCKER_CONFIG" || true
          fi
