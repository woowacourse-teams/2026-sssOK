name: Backend Version Bump

on:
  pull_request_target:
    branches: [ develop ]
    types: [opened, edited, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: backend-version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump:
    name: 백엔드 버전 자동 반영
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      # pull_request_target에서는 PR 코드를 실행하지 않고, 기준 브랜치의 검증 스크립트만 사용한다.
      - name: 자동화 스크립트 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: automation

      - name: 작업 브랜치 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pull-request
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 버전 증가 유형 읽기
        id: bump
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          BUMP="$(bash automation/.github/scripts/read-backend-version-bump.sh "$RUNNER_TEMP/pr-body.md")"
          echo "value=$BUMP" >> "$GITHUB_OUTPUT"

      - name: 백엔드 버전 반영
        env:
          BUMP: ${{ steps.bump.outputs.value }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_VERSION="$(sed -n 's/^version=//p' automation/backend/gradle.properties | tail -n 1 | tr -d ' \t\r')"
          bash automation/.github/scripts/backend-version.sh set \
            pull-request/backend/gradle.properties "$BASE_VERSION" "$BUMP"

          cd pull-request
          if git diff --quiet -- backend/gradle.properties; then
            echo "백엔드 버전이 이미 올바르다."
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/gradle.properties
          git commit -m "chore(backend): 백엔드 버전 자동 반영"
          git push origin "HEAD:$HEAD_REF"

          gh workflow run backend-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
          gh workflow run frontend-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
          gh workflow run backend-version-check.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" \
            -f "pr_number=$PR_NUMBER"
