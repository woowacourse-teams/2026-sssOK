name: Backend Deploy

on:
  push:
    branches: [ deploy ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  build:
    name: 이미지 빌드 및 푸시
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: meta
        run: |
          # GHCR 은 소문자 경로만 허용한다.
          REPO_LOWER=$(echo "ghcr.io/${GITHUB_REPOSITORY}/backend" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "image=${REPO_LOWER}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: QEMU 설정 (크로스 아키텍처 빌드용)
        uses: docker/setup-qemu-action@v3

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # 서버가 ARM64(Graviton)라 amd64 러너에서 크로스 빌드한다.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 서버 배포
    needs: build
    # 러너 자체가 배포 대상 EC2 위에서 돈다 (self-hosted).
    # 그래서 SSH/SCP 없이 로컬 명령으로 바로 배포한다.
    runs-on: [self-hosted, linux, ARM64]
    environment: production

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: compose 파일 배치
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p "$DEPLOY_PATH"
          cp backend/docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.prod.yml"

      - name: 이미지 교체 및 헬스체크
        env:
          NEW_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          cd "$DEPLOY_PATH"

          COMPOSE="docker compose --env-file .env --env-file image.env -f docker-compose.prod.yml"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # 롤백 대비로 직전 이미지 태그를 보관한다.
          if [ -f image.env ]; then
            cp image.env image.env.prev
          fi
          echo "BACKEND_IMAGE=$NEW_IMAGE" > image.env

          $COMPOSE pull
          $COMPOSE up -d

          echo "헬스체크 시작"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
              echo "헬스체크 성공 ($i번째 시도)"
              docker image prune -f > /dev/null 2>&1 || true
              docker logout ghcr.io > /dev/null 2>&1 || true
              exit 0
            fi
            sleep 5
          done

          echo "헬스체크 실패 - 직전 버전으로 롤백한다"
          $COMPOSE logs --tail 100 app || true

          if [ -f image.env.prev ]; then
            mv image.env.prev image.env
            $COMPOSE up -d
            echo "롤백 완료"
          else
            echo "직전 버전이 없어 롤백하지 못했다 (최초 배포로 추정)"
          fi

          docker logout ghcr.io > /dev/null 2>&1 || true
          exit 1
