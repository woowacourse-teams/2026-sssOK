# ALB 타겟 그룹이 80 포트로 헬스체크·트래픽을 보내는데, 앱은 8080에서 돈다.
# 그 간격을 메우는 리버스 프록시다. TLS는 ALB(ACM 인증서)에서 이미 끝내고 오므로
# 여기서는 순수 HTTP만 처리한다.
#
# 이 파일은 conf.d/default.conf 로 마운트돼 http 컨텍스트 안에서 읽힌다.
# 붙는 곳은 docker-compose.prod.yml 하나뿐이라, environment 는 prod 로 고정한다.

# 앱과 같은 필드 이름으로 남긴다. 이름이 같아야 Loki 에서 두 소스를 한 질의로 묶어,
# "앱에는 로그가 없는데 nginx 에는 있다"(= 앱까지 못 갔다) 같은 판정을 할 수 있다.
#
# requestId 로 $http_x_request_id(요청 헤더) 가 아니라 $upstream_http_x_request_id(응답 헤더)를
# 쓰는 게 핵심이다. ID 발급과 형식 검증은 앱이 하므로, 앱이 실제로 쓴 값은 응답 헤더에만 있다.
# 클라이언트가 보낸 값을 그대로 적으면 앱이 거절하고 새로 발급한 경우 두 로그가 어긋난다.
# 앱이 쓴 값이 1순위다. 다만 앱에 닿지 못한 요청(502·504·연결 실패)에는 응답 헤더가 없어
# 빈 값이 되는데, 그건 장애 때 가장 보고 싶은 줄이다. 그때만 nginx 가 만든 $request_id 로
# 대신 채워, 모든 access log 줄이 식별자를 갖게 한다.
#
# 두 값은 형식이 다르다 (앱 = 소문자 UUID 36자, nginx = hex 32자). 섞여도 문제되지 않는 건
# nginx 값이 쓰이는 줄에는 애초에 짝지을 앱 로그가 없기 때문이다 — 요청이 앱까지 못 갔다.
# 오히려 형식만 보고도 "앱까지 갔는지"를 가릴 수 있다.
map $upstream_http_x_request_id $sssok_request_id {
    ''      $request_id;
    default $upstream_http_x_request_id;
}

# ALB 를 거쳐 오므로 $remote_addr 는 그대로 두면 ALB 노드의 사설 IP 가 된다. 접근 로그의
# clientIp 가 전부 같은 몇 개 주소로 찍히면 "특정 사용자만 실패한다" 류의 판정을 할 수 없다.
# realip 모듈로 X-Forwarded-For 의 값을 $remote_addr 에 되돌려 놓는다.
#
# 신뢰 대역을 사설 IP 전체로 잡은 이유는, ALB 노드가 서브넷 안에서 주소를 옮겨 다녀 고정 IP 가
# 없고 VPC CIDR 도 배포 환경마다 다르기 때문이다. docker 브리지(172.16/12)도 같은 범위에 든다.
#
# 대역을 넓게 잡아도 위조에 열리지 않는다. realip 는 헤더가 아니라 실제 TCP 상대 주소인
# $remote_addr 가 이 대역에 들 때만 치환하기 때문이다. 공인 IP 에서 직접 붙어 XFF 를 꾸며
# 보내도 상대 주소가 사설 대역이 아니라 치환이 일어나지 않고, 그 요청의 clientIp 는 접속한
# 공인 IP 그대로 남는다. 사설 대역에서 이 포트에 닿을 수 있는 건 ALB 와 EC2 자신뿐이다.
#
# 그래도 "우리 VPC 한 줄" 로 좁히는 편이 더 정확한데, 이번에는 넓게 둔 채 남긴다. 이득과 위험이
# 이렇게 갈린다.
#
# 얻는 것: 지금 대역에는 같은 사설망의 다른 호스트·컨테이너도 든다. 그것들이 XFF 를 꾸며 보내면
# 접근 로그의 clientIp 가 그 값으로 남는다. 다만 그러려면 먼저 사설 IP 에서 이 80 포트에 닿아야
# 하고, 거기 닿을 수 있는 건 ALB·EC2 자신·같은 호스트의 컨테이너뿐이다 — 전부 이미 우리 안쪽이다.
# 외부에서 직접 쓸 수 있는 경로는 없어서, 좁혀서 막는 것은 "이미 침입한 뒤의 로그 조작" 한 가지다.
#
# 잃을 수 있는 것: CIDR 을 잘못 적으면 ALB 발 연결이 신뢰 대역에서 빠져 치환이 아예 멈춘다.
# 그러면 clientIp 가 전부 ALB 사설 IP 로 돌아가, 지금보다 나빠진다.
#
# 좁힐 때는 아래 두 줄로 바꾼다. VPC CIDR 은 콘솔(VPC → IPv4 CIDR) 이나 EC2 에서 확인한다.
#   curl -s http://169.254.169.254/latest/meta-data/mac | xargs -I{} \
#     curl -s http://169.254.169.254/latest/meta-data/network/interfaces/macs/{}/vpc-ipv4-cidr-block
#
#   set_real_ip_from <VPC CIDR>;     # ALB 가 들어오는 경로
#   set_real_ip_from 172.16.0.0/12;  # 같은 호스트의 docker 브리지 (이 줄은 남겨야 한다)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
# XFF 를 오른쪽부터 훑어 신뢰 대역이 아닌 첫 주소를 고른다. 끄면 맨 오른쪽 값(= ALB 가 붙인
# 주소)을 그대로 써서 되돌리는 의미가 없어진다.
real_ip_recursive on;

# realip 가 $remote_addr 를 실제 클라이언트로 바꿔 놓은 뒤라, 관례대로
# $proxy_add_x_forwarded_for 를 쓰면 ALB 가 이미 적어 둔 주소를 뒤에 한 번 더 붙인다
# (203.0.113.9 -> "203.0.113.9, 203.0.113.9"). ALB 가 준 체인을 그대로 넘기고,
# 체인이 없는 요청(VPC 안에서 직접 들어온 경우)에만 $remote_addr 로 채운다.
map $http_x_forwarded_for $sssok_forwarded_for {
    ''      $remote_addr;
    default $http_x_forwarded_for;
}

# ALB가 원래 요청 스킴을 X-Forwarded-Proto로 전달한다. ALB를 거치지 않은 로컬 요청만
# nginx가 직접 받은 스킴을 사용한다.
map $http_x_forwarded_proto $sssok_forwarded_proto {
    ''      $scheme;
    default $http_x_forwarded_proto;
}

# Grafana Live의 WebSocket 업그레이드 요청에만 upgrade를 전달한다.
map $http_upgrade $sssok_connection_upgrade {
    ''      close;
    default upgrade;
}

log_format sssok_json escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"level":"INFO",'
    '"service":"sssok-nginx",'
    '"environment":"prod",'
    '"requestId":"$sssok_request_id",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"message":"$request_method $uri $status",'
    '"durationSeconds":$request_time,'
    '"upstreamStatus":"$upstream_status",'
    '"bytesSent":$body_bytes_sent,'
    '"clientIp":"$remote_addr"'
    '}';

# 컨테이너 표준 출력으로 내보내야 docker json-file 드라이버를 거쳐 Alloy 가 수집한다.
access_log /dev/stdout sssok_json;

server {
    listen 80 default_server;
    server_name _;

    # 앱까지 못 간 요청(502·504)이나 nginx 가 직접 거절한 요청에도 요청 ID 를 돌려준다. 장애 때
    # 가장 받고 싶은 제보가 바로 그 요청인데, 앱이 응답하지 못했으니 응답 헤더에도 ID 가 없었다.
    # 이제 access log 의 requestId 와 같은 값이 헤더로 나가, 제보받은 ID 로 그 줄을 바로 찾는다.
    #
    # $sssok_request_id 는 앱이 쓴 값이 있으면 그 값이다. 그래서 정상 응답에서 이 헤더는 앱이 발급한
    # ID 그대로다 — 다만 그 경우 앱의 헤더와 여기 add_header 가 겹쳐 같은 헤더가 두 줄 나간다.
    # 브라우저는 두 값을 콤마로 합쳐 보여주고, 사용자가 읽어 주는 ID 가 UUID 두 개가 된다.
    # upstream 이 준 원본을 proxy_hide_header 로 지워, 항상 정확히 하나만 나가게 한다.
    # ($upstream_http_x_request_id 변수는 숨겨도 그대로 읽히므로 값은 잃지 않는다.)
    #
    # always 를 붙여야 4xx·5xx 에도 붙는다. 없으면 200 류에만 붙어 정작 필요한 응답이 빠진다.
    # server 블록에 두면 아래 location 이 물려받고, location 이 없는 nginx 자체 거절(400 등)에도
    # 적용된다.
    add_header X-Request-ID $sssok_request_id always;

    location / {
        proxy_pass http://app:8080;
        proxy_hide_header X-Request-ID;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $sssok_forwarded_for;
        # ALB가 이미 TLS를 처리했으니, 뒤의 앱에게는 원래 스킴이 https였다고 알려준다.
        # (CORS·리다이렉트 URL 생성 등에서 http로 오인하지 않도록)
        proxy_set_header X-Forwarded-Proto $sssok_forwarded_proto;
        # 클라이언트가 보낸 추적 ID 를 그대로 넘긴다. 없으면 빈 값이 가고, 앱이 새로 발급한다.
        # nginx 에서 만들지 않는 이유는 발급 규칙(형식·검증)을 한 곳에만 두기 위해서다.
        proxy_set_header X-Request-ID $http_x_request_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}


# ALB의 monitor.ssssok.com 호스트 규칙도 기존 애플리케이션 Target Group(:80)으로 전달한다.
# 여기서 Host 헤더로 Grafana 요청만 분기하므로 보안 그룹에 3000번 포트를 추가할 필요가 없다.
server {
    listen 80;
    server_name monitor.ssssok.com;

    # Docker 내장 DNS를 런타임에 조회한다. Grafana가 재시작되어 컨테이너 IP가 바뀌거나 잠시
    # 내려가도 Nginx와 기존 API 프록시는 계속 동작한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sssok_grafana_upstream grafana:3000;

    add_header X-Request-ID $sssok_request_id always;

    location / {
        proxy_pass http://$sssok_grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $sssok_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sssok_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sssok_connection_upgrade;
    }
}
