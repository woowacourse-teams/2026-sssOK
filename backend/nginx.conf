# 운영 Nginx: ALB(HTTPS) → Nginx(:80) → 앱(:8080).
# docker-compose.prod.yml에서 conf.d/default.conf로 마운트한다.
# monitor.ssssok.com 전체는 ALB가 중앙 서버로 직접 분기한다.
# 로그 필드 변경 시 monitoring/nginx/sssok-log-format.conf도 함께 확인한다.

# 헤더로 치환된 client IP가 아닌 실제 접속 주소로 중앙 수집기를 제한한다.
geo $realip_remote_addr $sssok_central_allowed {
    default 0;
    10.0.20.46 1;
}

# Docker 포트는 운영 사설 IP의 19100으로만 게시한다.
server {
    listen 19100;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sssok_node_upstream node-exporter:9100;
    set $sssok_management_upstream app:8081;

    location = /metrics {
        if ($sssok_central_allowed = 0) { return 403; }
        proxy_pass http://$sssok_node_upstream/metrics;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location = /app-metrics {
        if ($sssok_central_allowed = 0) { return 403; }
        proxy_pass http://$sssok_management_upstream/actuator/prometheus;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location = /alloy-metrics {
        if ($sssok_central_allowed = 0) { return 403; }
        set $sssok_alloy_upstream alloy:12345;
        proxy_pass http://$sssok_alloy_upstream/metrics;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location / {
        return 404;
    }
}

# 앱 응답의 요청 ID를 우선 사용하고, 앱에 도달하지 못하면 Nginx ID를 사용한다.
map $upstream_http_x_request_id $sssok_request_id {
    ''      $request_id;
    default $upstream_http_x_request_id;
}

# 기존 신뢰 대역을 유지한다. 공유 VPC의 다른 호스트도 포함되므로 ALB 전용 대역은 아니다.
# 대역 축소는 실제 ALB 서브넷과 Docker 경유 시 접속 주소를 확인한 뒤 별도 적용한다.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# realip 처리 후 클라이언트 IP가 중복 추가되지 않도록 전달받은 체인을 유지한다.
map $http_x_forwarded_for $sssok_forwarded_for {
    ''      $remote_addr;
    default $http_x_forwarded_for;
}

# ALB가 전달한 원래 스킴을 사용하며 헤더가 없을 때만 로컬 스킴을 사용한다.
map $http_x_forwarded_proto $sssok_forwarded_proto {
    ''      $scheme;
    default $http_x_forwarded_proto;
}

# 상태 코드로 로그 수준을 구분한다. JSON 로그는 각 server에서 한 번만 출력한다.
map $status $sssok_log_level {
    ~^5     ERROR;
    ~^4     WARN;
    default INFO;
}

log_format sssok_json escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"level":"$sssok_log_level",'
    '"service":"sssok-nginx",'
    '"environment":"prod",'
    '"requestId":"$sssok_request_id",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"message":"$request_method $uri $status",'
    '"durationSeconds":$request_time,'
    '"upstreamStatus":"$upstream_status",'
    '"bytesSent":$body_bytes_sent,'
    '"clientIp":"$remote_addr"'
    '}';

# API 및 ALB 상태 검사 요청.
server {
    listen 80 default_server;
    server_name _;

    access_log /dev/stdout sssok_json;

    add_header X-Request-ID $sssok_request_id always;

    location / {
        proxy_pass http://app:8080;
        # 앱 헤더와 Nginx 응답 헤더가 중복되지 않도록 원본은 숨긴다.
        proxy_hide_header X-Request-ID;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $sssok_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sssok_forwarded_proto;
        proxy_set_header X-Request-ID $http_x_request_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
