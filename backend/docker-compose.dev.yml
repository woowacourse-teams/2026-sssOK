# dev 서버용 compose. 운영(docker-compose.prod.yml)과 같은 블루-그린 구조다. CI 가 develop 브랜치에
# backend/** 변경이 병합되면 이 파일과 deploy/blue-green.sh 를 dev 서버로 전송한 뒤
#   DEPLOY_ENV=dev bash deploy/blue-green.sh deploy
# 로 실행한다. 앱은 app-blue / app-green 두 칸을 번갈아 쓰고, nginx 가 가리키는 칸만 트래픽을 받는다.
# 저장·조회·알림은 중앙 서버에서 운영한다.
#
# .env       : dev 서버에서 최초 1회 수동 생성 (DB 접속 정보, JWT, R2 자격증명, CORS 오리진, OAuth)
# blue.env   : 배포 스크립트가 app-blue 에 띄울 이미지·버전을 기록 (BLUE_IMAGE=ghcr.io/...:<커밋SHA>)
# green.env  : 같은 형식으로 app-green 용
# nginx/     : default.conf(monitoring/nginx/container/default.conf.template 을 CI 가 치환한 것)와
#              배포 스크립트가 쓰는 upstream.conf(활성 칸)
#
# 운영과 물리적으로 다른 EC2에서 돈다. DB는 운영과 같은 RDS 인스턴스를 쓰되, DB_URL의 데이터베이스
# 이름만 dev용(sssok_dev)으로 다르게 줘서 데이터를 분리한다 — 인스턴스 자체를 새로 만들지 않는다.

# 칸마다 environment 를 따로 쓰면 앵커의 environment 를 통째로 덮으므로, 공통 값은 이 앵커로 합친다.
x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: dev
  # 운영과 같은 힙 상한(#759). 서버 .env 의 JAVA_OPTS 보다 이 값이 우선한다.
  JAVA_OPTS: "-Xmx512m -Duser.timezone=Asia/Seoul"

x-app: &app
  restart: unless-stopped
  # 웹 요청 20s + 비동기 작업 20s 보다 길게 둔다 (기본 10s).
  stop_grace_period: 50s
  # 서버 .env의 설정을 앱에 전달한다. 같은 이름은 아래 environment 값이 우선한다.
  env_file:
    - .env
  # 두 칸이 함께 뜨므로 호스트 포트는 게시하지 않는다. API 는 nginx(:80), 지표는 nginx(:19100)를 거친다.
  expose:
    - "8080"
    # Actuator 관리 포트. 중앙 수집 요청만 nginx 내부 수집 포트를 거쳐 전달한다.
    - "8081"
  # 운영과 같은 한도(#759). 전환 중에는 두 칸이 함께 떠 있으므로 서버는 t4g.medium(4GiB) 이상이어야 한다(#764).
  mem_limit: 900m
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    # Alloy 가 이 라벨이 붙은 컨테이너만 수집하고, 값을 Loki 의 service 라벨로 쓴다.
    com.sssok.log.service: sssok-backend
  networks:
    - sssok

services:
  # 이미지가 비어 있어도 다른 칸을 다루는 compose 명령이 실패하지 않도록 자리표시 이미지를 둔다.
  # 자리표시 이미지로 실제 기동되는 일은 없다 (배포 스크립트가 해당 칸의 env 파일을 먼저 쓴다).
  app-blue:
    <<: *app
    image: ${BLUE_IMAGE:-sssok-app-unset}
    container_name: sssok-app-dev-blue
    environment:
      <<: *app-env
      APP_RELEASE_VERSION: ${BLUE_RELEASE_VERSION:-unknown}
      APP_BACKEND_VERSION: ${BLUE_BACKEND_VERSION:-unknown}
      APP_GIT_SHA: ${BLUE_GIT_SHA:-unknown}

  app-green:
    <<: *app
    image: ${GREEN_IMAGE:-sssok-app-unset}
    container_name: sssok-app-dev-green
    environment:
      <<: *app-env
      APP_RELEASE_VERSION: ${GREEN_RELEASE_VERSION:-unknown}
      APP_BACKEND_VERSION: ${GREEN_BACKEND_VERSION:-unknown}
      APP_GIT_SHA: ${GREEN_GIT_SHA:-unknown}

  # 운영과 같이 배포 중에는 다시 만들지 않고 reload 만 한다. 이 서비스 정의를 바꾸면 nginx 재생성
  # (1~2초 끊김)으로 반영한다 (docs/deployment/DEPLOYMENT.md).
  nginx:
    image: nginx:1.27.5-alpine
    container_name: sssok-nginx-dev
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "${MONITORING_PRIVATE_IP:-10.0.0.104}:19100:19100"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.sssok.log.service: sssok-nginx
    networks:
      - sssok

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: sssok-alloy-dev
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
      - /etc/alloy/config
    environment:
      # Loki 스트림의 environment 라벨이 된다.
      SSSOK_ENVIRONMENT: dev
      # Docker API 를 프록시로만 부른다 (아래 docker-socket-proxy 참고).
      SSSOK_DOCKER_HOST: tcp://docker-socket-proxy:2375
      CENTRAL_LOKI_URL: ${CENTRAL_LOKI_URL:-http://10.0.20.204:13100/loki/api/v1/push}
      GOMEMLIMIT: 200MiB
    mem_limit: 256m
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config/config.alloy:ro
      - ./monitoring/alloy/write.central.alloy:/etc/alloy/config/write.alloy:ro
      # 컨테이너별로 어디까지 읽었는지 저장한다. Alloy 를 재생성해도 이어서 읽는다.
      - alloy-data:/var/lib/alloy/data
      # dev 의 Nginx 는 컨테이너가 아니라 호스트에 직접 설치돼 있어 로그가 파일로 남는다.
      # 읽기만 한다. 회전은 호스트 logrotate 가 그대로 맡는다 (monitoring/README.md 의 dev 호스트 Nginx 설정 참고).
      - /var/log/nginx:/var/log/nginx-host:ro
    depends_on:
      - docker-socket-proxy
    expose:
      # 파이프라인 상태를 보는 Alloy UI 와 /metrics. 호스트에는 publish 하지 않는다.
      - "12345"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sssok
      - docker-api

  # Alloy 에 docker.sock 을 직접 주지 않으려고 둔다. 소켓은 :ro 로 마운트해도 API 권한은 그대로라,
  # 소켓을 가진 컨테이너는 다른 컨테이너를 만들고 exec 할 수 있다 — 사실상 호스트 root 권한이다.
  # 이 프록시는 GET /containers/*·/networks/* (목록·조회·로그)와 버전·ping 만 통과시키고 나머지는 403 으로 막는다.
  # Alloy 가 뚫려도 할 수 있는 일은 컨테이너 조회와 로그 읽기로 줄어든다.
  # 남는 노출: 컨테이너 조회(inspect) 응답에는 환경변수가 들어 있어 .env 의 비밀값을 읽을 수 있다.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: sssok-docker-socket-proxy-dev
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      # 컨테이너 탐색(discovery.docker)이 네트워크 정보도 조회한다. 이것도 GET 만 열린다.
      NETWORKS: 1
      # 기본값도 0 이지만, 쓰기 요청을 막는 게 이 컨테이너의 존재 이유라 명시한다.
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # Alloy 만 붙는 내부 네트워크. 앱·Nginx·Grafana 는 이 프록시에 닿지 않고, 외부로도 나가지 않는다.
      - docker-api

  # 중앙 요청은 Docker Nginx의 IP 제한을 거쳐 수집한다.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: sssok-node-exporter-dev
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.vmstat
      - --collector.loadavg
      - --collector.filesystem
      # 컨테이너 내부·가상 파일시스템은 빼고 실제 디스크만 본다.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|securityfs|squashfs|sysfs|tmpfs|tracefs)$$
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    # AMI 기본 수집기의 호스트 9100과 충돌하지 않도록 내부 네트워크로만 접근한다.
    expose:
      - "9100"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sssok

networks:
  sssok:
  docker-api:
    internal: true

volumes:
  alloy-data:
