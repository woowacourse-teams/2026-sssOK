# dev 서버용 compose. CI가 develop 브랜치에 backend/** 변경이 병합되면 이 파일을 dev 서버로
# 전송한 뒤
#   docker compose --env-file .env --env-file image.env -f docker-compose.dev.yml up -d
# 형태로 실행한다.
#
# .env       : dev 서버에서 최초 1회 수동 생성 (DB 접속 정보, JWT, R2 자격증명, CORS 오리진)
# image.env  : 배포마다 CI가 덮어씀 (BACKEND_IMAGE=ghcr.io/...:<커밋SHA> — 운영과 달리 태그가 아니라
#              커밋 해시로 식별한다)
#
# 운영과 물리적으로 다른 EC2에서 돈다. DB는 운영과 같은 RDS 인스턴스를 쓰되, DB_URL의 데이터베이스
# 이름만 dev용(sssok_dev)으로 다르게 줘서 데이터를 분리한다 — 인스턴스 자체를 새로 만들지 않는다.

services:
  app:
    image: ${BACKEND_IMAGE}
    container_name: sssok-app-dev
    restart: unless-stopped
    ports:
      # 호스트에 직접 설치된 Nginx 가 :80 으로 받아 여기로 넘긴다 (dev-api.ssssok.com).
      - "8080:8080"
    expose:
      # Actuator 관리 포트. 호스트에는 publish하지 않고 Prometheus만 내부에서 접근한다.
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # 배포마다 CI가 image.env 에 써 넣는다. 값이 없어도(구버전 image.env, 수동 기동) 뜨도록 기본값을 둔다.
      APP_RELEASE_VERSION: ${APP_RELEASE_VERSION:-unknown}
      APP_BACKEND_VERSION: ${APP_BACKEND_VERSION:-unknown}
      APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Alloy 가 이 라벨이 붙은 컨테이너만 수집하고, 값을 Loki 의 service 라벨로 쓴다.
      com.sssok.log.service: sssok-backend
    networks:
      - sssok

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: sssok-prometheus-dev
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      alertmanager:
        condition: service_started
    expose:
      - "9090"
    networks:
      - sssok

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: sssok-alertmanager-dev
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets:
      - discord_webhook_url
    expose:
      - "9093"
    networks:
      - sssok

  loki:
    image: grafana/loki:3.7.8
    container_name: sssok-loki-dev
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      # 팀 합의(dev 7일). 배포 직후 확인용이라 운영(30일)보다 짧게 둔다.
      LOKI_RETENTION_PERIOD: 168h
      # 앱과 같은 인스턴스에서 돈다. 한도(mem_limit)에 닿아 OOM 으로 죽기 전에 GC 가 먼저 돌게 한다.
      GOMEMLIMIT: 400MiB
    mem_limit: 512m
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      # 저장된 로그. 이 볼륨이 남아 있으면 Loki·앱 컨테이너를 재생성해도 로그가 그대로다.
      - loki-data:/loki
    expose:
      - "3100"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sssok

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: sssok-alloy-dev
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      # Loki 스트림의 environment 라벨이 된다.
      SSSOK_ENVIRONMENT: dev
      GOMEMLIMIT: 200MiB
    mem_limit: 256m
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # 컨테이너별로 어디까지 읽었는지 저장한다. Alloy 를 재생성해도 이어서 읽는다.
      - alloy-data:/var/lib/alloy/data
      # 수집 대상 컨테이너를 찾고 로그를 읽는 Docker API. 앱은 Alloy 를 모르고, Alloy 가 멈춰도
      # 앱 로그는 json-file 에 계속 쌓인다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # dev 의 Nginx 는 컨테이너가 아니라 호스트에 직접 설치돼 있어 로그가 파일로 남는다.
      # 읽기만 한다. 회전은 호스트 logrotate 가 그대로 맡는다 (monitoring/nginx/README 참고).
      - /var/log/nginx:/var/log/nginx-host:ro
    depends_on:
      - loki
    expose:
      # 파이프라인 상태를 보는 Alloy UI. 호스트에는 publish 하지 않는다.
      - "12345"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sssok

  grafana:
    image: grafana/grafana:13.2.2
    container_name: sssok-grafana-dev
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # 인터넷에 직접 공개하지 않고 SSH 터널을 통해서만 접속한다.
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - sssok

networks:
  sssok:

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:

secrets:
  discord_webhook_url:
    file: ${DISCORD_WEBHOOK_FILE:-./secrets/discord-webhook-url}
