services:
  postgres:
    image: postgres:16-alpine
    container_name: sssok-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-sssok}
      POSTGRES_USER: ${DB_USERNAME:-sssok}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sssok}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sssok} -d ${DB_NAME:-sssok}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
