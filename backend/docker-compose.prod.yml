# 운영 서버용 compose. 배포는 CI 가 이 파일과 deploy/blue-green.sh 를 서버로 전송한 뒤
#   bash deploy/blue-green.sh deploy
# 로 실행한다. 앱은 app-blue / app-green 두 칸을 번갈아 쓰고, nginx 가 가리키는 칸만 트래픽을 받는다.
#
# .env       : 서버에서 최초 1회 수동 생성 (DB 접속 정보, JWT, R2 자격증명, OAuth)
# blue.env   : 배포 스크립트가 app-blue 에 띄울 이미지·버전을 기록 (BLUE_IMAGE=ghcr.io/...:<sha>)
# green.env  : 같은 형식으로 app-green 용
# nginx/     : default.conf(저장소 nginx.conf 복사본)와 배포 스크립트가 쓰는 upstream.conf(활성 칸)
#
# 저장·조회·알림은 중앙 모니터링 서버에서 관리한다. 기존 데이터 볼륨은 전환 시 삭제하지 않는다.
# DB는 RDS를 쓴다. 컨테이너로 띄우지 않으므로 DB_URL은 RDS 엔드포인트를 가리켜야 한다.
#
# ALB 타겟 그룹이 80 포트로 헬스체크·트래픽을 보내는데 앱은 8080이라, nginx가 그 사이를
# 메운다 (nginx.conf 참고). TLS는 ALB(ACM)에서 이미 끝내고 오므로 여기는 평문 HTTP만 처리.

# 칸마다 environment 를 따로 쓰면 앵커의 environment 를 통째로 덮으므로, 공통 값은 이 앵커로 합친다.
x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: prod
  # JVM 힙 상한. Dockerfile 기본값(MaxRAMPercentage=75)은 컨테이너 한도가 없으면 호스트 RAM 기준이라
  # 힙 최대가 호스트 메모리에 비례해 커지고, 업로드 후처리 때 힙 커밋이 팽창해 호스트를 고갈시켰다(#759).
  # 서버 .env 의 JAVA_OPTS 보다 이 값이 우선한다.
  JAVA_OPTS: "-Xmx512m -Duser.timezone=Asia/Seoul"

x-app: &app
  restart: unless-stopped
  # 웹 요청 20s + 비동기 작업 20s 보다 길게 둔다 (기본 10s).
  stop_grace_period: 50s
  # 서버 .env의 설정을 앱에 전달한다. 같은 이름은 아래 environment 값이 우선한다.
  env_file:
    - .env
  expose:
    - "8080"
    # Actuator 관리 포트. Nginx로 전달하거나 호스트에 publish하지 않는다.
    - "8081"
  # 앱이 이 한도를 넘으면 호스트 전체가 아니라 이 컨테이너만 정리되고, restart 정책으로 다시 뜬다.
  # 힙 상한 + 비힙(약 216MiB) + 그 밖(약 130MiB)을 더한 최악의 RSS(약 860MiB)가 이 안에 들도록 잡았다.
  # 전환 중에는 두 칸이 함께 떠 있으므로 서버는 t4g.medium(4GiB) 이상이어야 한다(#764).
  mem_limit: 900m
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    # Alloy 가 이 라벨이 붙은 컨테이너만 수집하고, 값을 Loki 의 service 라벨로 쓴다.
    com.sssok.log.service: sssok-backend
  networks:
    - sssok

services:
  # 이미지가 비어 있어도 다른 칸을 다루는 compose 명령이 실패하지 않도록 자리표시 이미지를 둔다.
  # 자리표시 이미지로 실제 기동되는 일은 없다 (배포 스크립트가 해당 칸의 env 파일을 먼저 쓴다).
  app-blue:
    <<: *app
    image: ${BLUE_IMAGE:-sssok-app-unset}
    container_name: sssok-app-blue
    environment:
      <<: *app-env
      APP_RELEASE_VERSION: ${BLUE_RELEASE_VERSION:-unknown}
      APP_BACKEND_VERSION: ${BLUE_BACKEND_VERSION:-unknown}
      APP_GIT_SHA: ${BLUE_GIT_SHA:-unknown}

  app-green:
    <<: *app
    image: ${GREEN_IMAGE:-sssok-app-unset}
    container_name: sssok-app-green
    environment:
      <<: *app-env
      APP_RELEASE_VERSION: ${GREEN_RELEASE_VERSION:-unknown}
      APP_BACKEND_VERSION: ${GREEN_BACKEND_VERSION:-unknown}
      APP_GIT_SHA: ${GREEN_GIT_SHA:-unknown}

  # 배포 중에는 다시 만들지 않고 reload 만 한다. 이 서비스 정의를 바꾸면 반영에 nginx 재생성(1~2초 끊김)이
  # 필요하므로 사용자가 적은 시간에 수동으로 적용한다 (docs/deployment/DEPLOYMENT.md).
  nginx:
    image: nginx:1.27.5-alpine
    container_name: sssok-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "${MONITORING_PRIVATE_IP:-10.0.20.161}:19100:19100"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Alloy 가 이 라벨이 붙은 컨테이너만 수집하고, 값을 Loki 의 service 라벨로 쓴다.
      com.sssok.log.service: sssok-nginx
    networks:
      - sssok

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: sssok-alloy
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
      - /etc/alloy/config
    environment:
      # Loki 스트림의 environment 라벨이 된다.
      SSSOK_ENVIRONMENT: prod
      # Docker API 를 프록시로만 부른다 (아래 docker-socket-proxy 참고).
      SSSOK_DOCKER_HOST: tcp://docker-socket-proxy:2375
      CENTRAL_LOKI_URL: ${CENTRAL_LOKI_URL:-http://10.0.20.204:13100/loki/api/v1/push}
      GOMEMLIMIT: 200MiB
    mem_limit: 256m
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config/config.alloy:ro
      - ./monitoring/alloy/write.central.alloy:/etc/alloy/config/write.alloy:ro
      # 컨테이너별로 어디까지 읽었는지 저장한다. Alloy 를 재생성해도 이어서 읽는다.
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - docker-socket-proxy
    expose:
      # 파이프라인 상태를 보는 Alloy UI 와 /metrics. 호스트에는 publish 하지 않는다.
      - "12345"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sssok
      - docker-api

  # Alloy 에 docker.sock 을 직접 주지 않으려고 둔다. 소켓은 :ro 로 마운트해도 API 권한은 그대로라,
  # 소켓을 가진 컨테이너는 다른 컨테이너를 만들고 exec 할 수 있다 — 사실상 호스트 root 권한이다.
  # 이 프록시는 GET /containers/*·/networks/* (목록·조회·로그)와 버전·ping 만 통과시키고 나머지는 403 으로 막는다.
  # Alloy 가 뚫려도 할 수 있는 일은 컨테이너 조회와 로그 읽기로 줄어든다.
  # 남는 노출: 컨테이너 조회(inspect) 응답에는 환경변수가 들어 있어 .env 의 비밀값을 읽을 수 있다.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: sssok-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      # 컨테이너 탐색(discovery.docker)이 네트워크 정보도 조회한다. 이것도 GET 만 열린다.
      NETWORKS: 1
      # 기본값도 0 이지만, 쓰기 요청을 막는 게 이 컨테이너의 존재 이유라 명시한다.
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # Alloy 만 붙는 내부 네트워크. 앱·Nginx·Grafana 는 이 프록시에 닿지 않고, 외부로도 나가지 않는다.
      - docker-api

  # 호스트 디스크 사용량을 Prometheus 에 넘긴다. Loki·Docker 이미지·json-file 로그가 모두 같은
  # 루트 디스크를 쓰므로, 어느 쪽이 채우든 앱까지 멈추기 전에 알림(HostDiskSpaceLow)을 받기 위해 둔다.
  # 호스트 루트를 읽기 전용으로만 마운트하고, 필요한 파일시스템 수집기 외에는 끈다.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: sssok-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.vmstat
      - --collector.loadavg
      - --collector.filesystem
      # 컨테이너 내부·가상 파일시스템은 빼고 실제 디스크만 본다.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|securityfs|squashfs|sysfs|tmpfs|tracefs)$$
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    expose:
      - "9100"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sssok

networks:
  sssok:
  docker-api:
    internal: true

volumes:
  alloy-data:
