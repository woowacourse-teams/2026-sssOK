# 운영 서버용 compose. CI가 이 파일을 서버로 전송한 뒤
#   docker compose --env-file .env --env-file image.env -f docker-compose.prod.yml up -d
# 형태로 실행한다.
#
# .env       : 서버에서 최초 1회 수동 생성 (DB 접속 정보, JWT, R2 자격증명)
# image.env  : 배포마다 CI가 덮어씀 (BACKEND_IMAGE=ghcr.io/...:<sha>)
#
# DB는 RDS를 쓴다. 컨테이너로 띄우지 않으므로 DB_URL은 RDS 엔드포인트를 가리켜야 한다.
#
# ALB 타겟 그룹이 80 포트로 헬스체크·트래픽을 보내는데 앱은 8080이라, nginx가 그 사이를
# 메운다 (nginx.conf 참고). TLS는 ALB(ACM)에서 이미 끝내고 오므로 여기는 평문 HTTP만 처리.

services:
  app:
    image: ${BACKEND_IMAGE}
    container_name: sssok-app
    restart: unless-stopped
    expose:
      - "8080"
      # Actuator 관리 포트. Nginx로 전달하거나 호스트에 publish하지 않는다.
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 배포마다 CI가 image.env 에 써 넣는다. 값이 없어도(구버전 image.env, 수동 기동) 뜨도록 기본값을 둔다.
      APP_RELEASE_VERSION: ${APP_RELEASE_VERSION:-unknown}
      APP_BACKEND_VERSION: ${APP_BACKEND_VERSION:-unknown}
      APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # 비어 있으면 의견 알림만 꺼진다.
      DISCORD_FEEDBACK_WEBHOOK_URL: ${DISCORD_FEEDBACK_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Alloy 가 이 라벨이 붙은 컨테이너만 수집하고, 값을 Loki 의 service 라벨로 쓴다.
      com.sssok.log.service: sssok-backend
    networks:
      - sssok

  nginx:
    image: nginx:1.27-alpine
    container_name: sssok-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Alloy 가 이 라벨이 붙은 컨테이너만 수집하고, 값을 Loki 의 service 라벨로 쓴다.
      com.sssok.log.service: sssok-nginx
    networks:
      - sssok

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: sssok-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    environment:
      # 알림의 environment 라벨이 된다 (prometheus.yml 의 external_labels).
      SSSOK_ENVIRONMENT: prod
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      alertmanager:
        condition: service_started
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - sssok

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: sssok-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets:
      - discord_webhook_url
    expose:
      - "9093"
    networks:
      - sssok

  loki:
    image: grafana/loki:3.7.8
    container_name: sssok-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      # 팀 합의(prod 30일). 장애 원인을 배포 주기보다 길게 되짚을 수 있게 한다. 지난 로그는 Loki compactor 가 지운다.
      LOKI_RETENTION_PERIOD: 720h
      # 앱과 같은 인스턴스에서 돈다. 한도(mem_limit)에 닿아 OOM 으로 죽기 전에 GC 가 먼저 돌게 한다.
      GOMEMLIMIT: 400MiB
    mem_limit: 512m
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      # 저장된 로그. 이 볼륨이 남아 있으면 Loki·앱 컨테이너를 재생성해도 로그가 그대로다.
      - loki-data:/loki
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sssok

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: sssok-alloy
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      # Loki 스트림의 environment 라벨이 된다.
      SSSOK_ENVIRONMENT: prod
      # Docker API 를 프록시로만 부른다 (아래 docker-socket-proxy 참고).
      SSSOK_DOCKER_HOST: tcp://docker-socket-proxy:2375
      GOMEMLIMIT: 200MiB
    mem_limit: 256m
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # 컨테이너별로 어디까지 읽었는지 저장한다. Alloy 를 재생성해도 이어서 읽는다.
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
      - docker-socket-proxy
    expose:
      # 파이프라인 상태를 보는 Alloy UI 와 /metrics. 호스트에는 publish 하지 않는다.
      - "12345"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sssok
      - docker-api

  # Alloy 에 docker.sock 을 직접 주지 않으려고 둔다. 소켓은 :ro 로 마운트해도 API 권한은 그대로라,
  # 소켓을 가진 컨테이너는 다른 컨테이너를 만들고 exec 할 수 있다 — 사실상 호스트 root 권한이다.
  # 이 프록시는 GET /containers/*·/networks/* (목록·조회·로그)와 버전·ping 만 통과시키고 나머지는 403 으로 막는다.
  # Alloy 가 뚫려도 할 수 있는 일은 컨테이너 조회와 로그 읽기로 줄어든다.
  # 남는 노출: 컨테이너 조회(inspect) 응답에는 환경변수가 들어 있어 .env 의 비밀값을 읽을 수 있다.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: sssok-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      # 컨테이너 탐색(discovery.docker)이 네트워크 정보도 조회한다. 이것도 GET 만 열린다.
      NETWORKS: 1
      # 기본값도 0 이지만, 쓰기 요청을 막는 게 이 컨테이너의 존재 이유라 명시한다.
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # Alloy 만 붙는 내부 네트워크. 앱·Nginx·Grafana 는 이 프록시에 닿지 않고, 외부로도 나가지 않는다.
      - docker-api

  # 호스트 디스크 사용량을 Prometheus 에 넘긴다. Loki·Docker 이미지·json-file 로그가 모두 같은
  # 루트 디스크를 쓰므로, 어느 쪽이 채우든 앱까지 멈추기 전에 알림(HostDiskSpaceLow)을 받기 위해 둔다.
  # 호스트 루트를 읽기 전용으로만 마운트하고, 필요한 파일시스템 수집기 외에는 끈다.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: sssok-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.filesystem
      # 컨테이너 내부·가상 파일시스템은 빼고 실제 디스크만 본다.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|securityfs|squashfs|sysfs|tmpfs|tracefs)$
    volumes:
      - /:/host:ro
    mem_limit: 64m
    expose:
      - "9100"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sssok

  grafana:
    image: grafana/grafana:13.2.2
    container_name: sssok-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      # TLS는 ALB에서 종료한다. Grafana가 로그인·정적 리소스 URL을 공개 주소로 생성하게 한다.
      GF_SERVER_ROOT_URL: https://monitor.ssssok.com
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
    ports:
      # 운영 점검용 로컬 접근만 허용한다. 외부 요청은 ALB :443 → Nginx :80 → Docker network로 전달한다.
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - sssok

networks:
  sssok:
  docker-api:
    internal: true

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:

secrets:
  discord_webhook_url:
    file: ${DISCORD_WEBHOOK_FILE:-./secrets/discord-webhook-url}
