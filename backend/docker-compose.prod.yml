# 운영 서버용 compose. CI가 이 파일을 서버로 전송한 뒤
#   docker compose --env-file .env --env-file image.env -f docker-compose.prod.yml up -d
# 형태로 실행한다.
#
# .env       : 서버에서 최초 1회 수동 생성 (DB 접속 정보, JWT, R2 자격증명)
# image.env  : 배포마다 CI가 덮어씀 (BACKEND_IMAGE=ghcr.io/...:<sha>)
#
# DB는 RDS를 쓴다. 컨테이너로 띄우지 않으므로 DB_URL은 RDS 엔드포인트를 가리켜야 한다.
#
# ALB 타겟 그룹이 80 포트로 헬스체크·트래픽을 보내는데 앱은 8080이라, nginx가 그 사이를
# 메운다 (nginx.conf 참고). TLS는 ALB(ACM)에서 이미 끝내고 오므로 여기는 평문 HTTP만 처리.

services:
  app:
    image: ${BACKEND_IMAGE}
    container_name: sssok-app
    restart: unless-stopped
    expose:
      - "8080"
      # Actuator 관리 포트. Nginx로 전달하거나 호스트에 publish하지 않는다.
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 배포마다 CI가 image.env 에 써 넣는다. 값이 없어도(구버전 image.env, 수동 기동) 뜨도록 기본값을 둔다.
      APP_RELEASE_VERSION: ${APP_RELEASE_VERSION:-unknown}
      APP_BACKEND_VERSION: ${APP_BACKEND_VERSION:-unknown}
      APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Alloy 가 이 라벨이 붙은 컨테이너만 수집하고, 값을 Loki 의 service 라벨로 쓴다.
      com.sssok.log.service: sssok-backend
    networks:
      - sssok

  nginx:
    image: nginx:1.27-alpine
    container_name: sssok-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Alloy 가 이 라벨이 붙은 컨테이너만 수집하고, 값을 Loki 의 service 라벨로 쓴다.
      com.sssok.log.service: sssok-nginx
    networks:
      - sssok

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: sssok-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      alertmanager:
        condition: service_started
    expose:
      - "9090"
    networks:
      - sssok

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: sssok-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets:
      - discord_webhook_url
    expose:
      - "9093"
    networks:
      - sssok

  loki:
    image: grafana/loki:3.7.8
    container_name: sssok-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      # 팀 합의(prod 30일). 장애 원인을 배포 주기보다 길게 되짚을 수 있게 한다. 지난 로그는 Loki compactor 가 지운다.
      LOKI_RETENTION_PERIOD: 720h
      # 앱과 같은 인스턴스에서 돈다. 한도(mem_limit)에 닿아 OOM 으로 죽기 전에 GC 가 먼저 돌게 한다.
      GOMEMLIMIT: 400MiB
    mem_limit: 512m
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      # 저장된 로그. 이 볼륨이 남아 있으면 Loki·앱 컨테이너를 재생성해도 로그가 그대로다.
      - loki-data:/loki
    expose:
      - "3100"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sssok

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: sssok-alloy
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      # Loki 스트림의 environment 라벨이 된다.
      SSSOK_ENVIRONMENT: prod
      GOMEMLIMIT: 200MiB
    mem_limit: 256m
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # 컨테이너별로 어디까지 읽었는지 저장한다. Alloy 를 재생성해도 이어서 읽는다.
      - alloy-data:/var/lib/alloy/data
      # 수집 대상 컨테이너를 찾고 로그를 읽는 Docker API. 앱은 Alloy 를 모르고, Alloy 가 멈춰도
      # 앱 로그는 json-file 에 계속 쌓인다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    expose:
      # 파이프라인 상태를 보는 Alloy UI. 호스트에는 publish 하지 않는다.
      - "12345"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sssok

  grafana:
    image: grafana/grafana:13.2.2
    container_name: sssok-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      # TLS는 ALB에서 종료한다. Grafana가 로그인·정적 리소스 URL을 공개 주소로 생성하게 한다.
      GF_SERVER_ROOT_URL: https://monitor.ssssok.com
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
    ports:
      # 운영 점검용 로컬 접근만 허용한다. 외부 요청은 ALB :443 → Nginx :80 → Docker network로 전달한다.
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - sssok

networks:
  sssok:

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:

secrets:
  discord_webhook_url:
    file: ${DISCORD_WEBHOOK_FILE:-./secrets/discord-webhook-url}
