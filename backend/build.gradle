plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
// version 은 gradle.properties 가 갖는다 (릴리스 때 그 파일만 고치면 되도록).
description = 'sssOK'

springBoot {
    // JAR 안에 META-INF/build-info.properties 를 넣어, 실행 중인 앱이 자기 버전과 빌드 시각을 읽게 한다.
    // 로컬·IDE 실행에는 이 파일이 없을 수 있으므로 읽는 쪽에서 부재를 허용한다 (VersionConfig).
    buildInfo()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    querydslVersion = '5.0.0'
    jjwtVersion = '0.12.6'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // API 문서화 (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'

    // DB 마이그레이션
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // QueryDSL
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // 이미지 썸네일
    implementation 'net.coobird:thumbnailator:0.4.20'

    // WebP 인코딩. ImageIO 는 WebP 를 모르므로 ImageWriter 를 얹어 준다.
    // JAR 안에 리눅스 x86_64/aarch64 · macOS aarch64 네이티브가 들어 있어 별도 설치가 필요 없다.
    // 포맷 선정 근거: docs/backend/IMAGE_DERIVATIVE_FORMAT.md
    implementation 'io.github.darkxanter:webp-imageio:0.3.3'

    // EXIF 촬영 시각·GPS 추출
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'

    // 관리자 비밀번호 해싱. 시큐리티 필터 체인은 쓰지 않으므로 starter 대신 crypto 모듈만 가져온다.
    implementation 'org.springframework.security:spring-security-crypto'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // AWS SDK S3 (Cloudflare R2)
    implementation 'software.amazon.awssdk:s3:2.25.0'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Repository+Service 통합 테스트용 (기본 CRUD는 H2로 빠르게 검증)
    testImplementation 'com.h2database:h2'

    // API 인수 테스트 / PostgreSQL 전용 기능(JSONB 등) 검증용 실제 PostgreSQL
    // 자세히: docs/backend/TEST_CONVENTION.md
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}


// #291 파생 이미지 포맷 선정용 측정기. 표준 테스트에 섞으면 CI 가 매번 사진 수십 장을 인코딩하므로
// 별도 태스크로 떼어 둔다. AVIF 측정에는 ffmpeg 이 PATH 에 있어야 한다.
//   ./gradlew derivativeFormatBenchmark -Psamples=/경로/샘플 -Pout=결과.csv
tasks.register('derivativeFormatBenchmark', JavaExec) {
    group = 'verification'
    description = '샘플 사진을 JPEG / WebP / AVIF 로 인코딩해 변환 시간·크기·SSIM 을 측정한다'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sssok.benchmark.DerivativeFormatBenchmark'
    systemProperty 'samples', findProperty('samples') ?: ''
    systemProperty 'out', findProperty('out') ?: 'derivative-format-benchmark.csv'
    systemProperty 'widths', findProperty('widths') ?: ''
}

// 같은 목적의 두 번째 측정기. 워커 풀이 동시에 돌 때 포맷별 처리량이 어떻게 갈리는지 본다.
//   ./gradlew derivativeConcurrencyBenchmark -Psamples=/경로/샘플 -Pout=결과.csv
tasks.register('derivativeConcurrencyBenchmark', JavaExec) {
    group = 'verification'
    description = '워커 풀 동시 실행 조건에서 WebP·AVIF 인코딩 처리량을 측정한다'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sssok.benchmark.DerivativeConcurrencyBenchmark'
    systemProperty 'samples', findProperty('samples') ?: ''
    systemProperty 'out', findProperty('out') ?: 'derivative-concurrency-benchmark.csv'
}

// 자체 SSIM 구현을 ffmpeg 의 ssim 필터와 맞대 본다. 포맷 결정의 근거가 되는 지표라,
// 값이 맞는지 확인할 수 있어야 한다.
//   ./gradlew ssimValidation -Psamples=/경로/무손실PNG -Pout=결과.csv
tasks.register('ssimValidation', JavaExec) {
    group = 'verification'
    description = '자체 SSIM 구현을 ffmpeg 의 ssim 필터와 교차 검증한다'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sssok.benchmark.SsimValidation'
    systemProperty 'samples', findProperty('samples') ?: ''
    systemProperty 'out', findProperty('out') ?: 'ssim-validation.csv'
}
