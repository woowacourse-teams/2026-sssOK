plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
// version 은 gradle.properties 가 갖는다 (릴리스 때 그 파일만 고치면 되도록).
description = 'sssOK'

springBoot {
    // JAR 안에 META-INF/build-info.properties 를 넣어, 실행 중인 앱이 자기 버전과 빌드 시각을 읽게 한다.
    // 로컬·IDE 실행에는 이 파일이 없을 수 있으므로 읽는 쪽에서 부재를 허용한다 (VersionConfig).
    buildInfo()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    querydslVersion = '5.0.0'
    jjwtVersion = '0.12.6'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // API 문서화 (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'

    // DB 마이그레이션
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // QueryDSL
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // 이미지 썸네일
    implementation 'net.coobird:thumbnailator:0.4.20'

    // EXIF 촬영 시각·GPS 추출
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'

    // 관리자 비밀번호 해싱. 시큐리티 필터 체인은 쓰지 않으므로 starter 대신 crypto 모듈만 가져온다.
    implementation 'org.springframework.security:spring-security-crypto'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // AWS SDK S3 (Cloudflare R2)
    implementation 'software.amazon.awssdk:s3:2.25.0'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Repository+Service 통합 테스트용 (기본 CRUD는 H2로 빠르게 검증)
    testImplementation 'com.h2database:h2'

    // API 인수 테스트 / PostgreSQL 전용 기능(JSONB 등) 검증용 실제 PostgreSQL
    // 자세히: docs/backend/TEST_CONVENTION.md
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}

