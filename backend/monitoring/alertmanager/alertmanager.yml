route:
  receiver: discord
  group_by:
    - alertname
    - service
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        # 제목에 환경을 붙여 dev·prod 알림을 한눈에 구분한다 (Prometheus external_labels 의 environment).
        title: '{{ if eq .Status "firing" }}[FIRING]{{ else }}[RESOLVED]{{ end }}[{{ .CommonLabels.environment }}] {{ .CommonLabels.alertname }}'
        # 블록 문자열로 써야 줄바꿈이 실제 줄바꿈으로 간다. 작은따옴표 안의 \n 은 글자 그대로 Discord 에 찍힌다.
        #
        # 로그 링크는 환경별 Grafana 의 sssOK Logs 대시보드를 연다. dev Grafana 는 공개 주소가 없어
        # SSH 터널(localhost:3000)을 열어 둔 상태에서만 열린다. 시간 범위는 첫 알림 시작 15분 전부터 지금까지다.
        # 변수를 하나라도 URL 에 적지 않으면 Grafana 가 그 브라우저에서 마지막으로 본 변수·시간 범위를 복원해
        # 링크의 시간 범위를 덮어쓴다. 그래서 변수를 모두 명시한다.
        message: |-
          {{ range .Alerts }}**{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          {{ end }}{{ $grafana := "http://localhost:3000" }}{{ if eq .CommonLabels.environment "prod" }}{{ $grafana = "https://monitor.ssssok.com" }}{{ end }}[ERROR 로그 보기]({{ $grafana }}/d/sssok-logs/sssok-logs?from={{ ((index .Alerts 0).StartsAt.Add -900000000000).UnixMilli }}&to=now&var-environment={{ .CommonLabels.environment }}&var-requestId=&var-version=)
