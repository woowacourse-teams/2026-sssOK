groups:
  - name: sssok-backend-availability
    rules:
      - alert: BackendDown
        expr: up{job="sssok-backend"} == 0
        for: 2m
        keep_firing_for: 5m
        labels:
          severity: critical
          service: sssok-backend
        annotations:
          summary: sssOK 백엔드 메트릭 수집 실패
          description: "{{ $labels.instance }} 인스턴스의 메트릭을 2분 이상 수집하지 못했습니다."

  - name: sssok-backend-http
    rules:
      - alert: BackendHigh5xxErrorRate
        expr: |
          (
            sum(increase(http_server_requests_seconds_count{job="sssok-backend", status=~"5..", uri!~"/actuator.*"}[5m]))
            /
            sum(increase(http_server_requests_seconds_count{job="sssok-backend", uri!~"/actuator.*"}[5m]))
          ) > 0.05
          and
          sum(increase(http_server_requests_seconds_count{job="sssok-backend", uri!~"/actuator.*"}[5m])) >= 20
        keep_firing_for: 5m
        labels:
          severity: warning
          service: sssok-backend
        annotations:
          summary: sssOK 백엔드 5xx 오류율 증가
          description: "최근 5분간 요청이 20건 이상이며 5xx 오류율이 5%를 초과했습니다. 현재 오류율: {{ $value | humanizePercentage }}"
