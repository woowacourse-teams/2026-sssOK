global:
  # 대시보드와 2분 중단 알림에 충분한 해상도를 확보하면서 수집 부하는 낮게 유지한다.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: sssok-backend
    metrics_path: /actuator/prometheus
    static_configs:
      # 같은 Docker Compose 네트워크에서는 서비스 이름으로 애플리케이션을 찾는다.
      - targets:
          - app:8080
