# 모니터링 도메인 전체를 중앙 Grafana로 연결한다. compose.yml과 함께 사용한다.
services:
  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://monitor.ssssok.com/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_AUTH_LOGIN_COOKIE_NAME: sssok_central_session
      GF_SECURITY_COOKIE_SECURE: "true"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 32m
    ports:
      - "10.0.20.46:80:80"
      - "10.0.20.46:13100:13100"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - grafana
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
