map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

# 헤더로 전달된 IP 대신 실제 연결 원본으로 로그 전송 서버를 제한한다.
geo $realip_remote_addr $loki_sender_allowed {
    default 0;
    10.0.0.69 1;
    10.0.20.127 1;
}

server {
    listen 13100;
    server_name _;
    client_max_body_size 4m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /loki/api/v1/push {
        if ($loki_sender_allowed = 0) { return 403; }
        limit_except POST { deny all; }
        set $loki_upstream loki:3100;
        proxy_pass http://$loki_upstream/loki/api/v1/push;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        access_log off;
    }

    location / {
        return 404;
    }
}

server {
    listen 80 default_server;
    server_name monitor.ssssok.com;
    absolute_redirect off;

    location = /health {
        proxy_pass http://grafana:3000/api/health;
    }

    location = /central {
        return 302 /$is_args$args;
    }

    location /central/ {
        rewrite ^/central/(.*)$ /$1 redirect;
    }

    location / {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

}
