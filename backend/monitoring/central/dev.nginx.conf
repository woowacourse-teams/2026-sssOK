# 개발 호스트 /etc/nginx/conf.d/sssok-dev.conf용 통합 설정.
# 기존 app.conf와 sites-enabled/dev-api.ssssok.com을 백업 후 비활성화한다.
# 별도 sssok-node-metrics.conf를 적용했다면 그 파일도 비활성화해야 한다.
# 공통 sssok-log-format.conf는 유지한다. node-exporter loopback 연결이 선행 조건이다.
server {
    listen 80;
    server_name api.ssssok.com dev-api.ssssok.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 기존 개발 API의 SSE 동작을 유지한다.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_cache off;
    }
}

server {
    listen 10.0.0.69:19100;
    server_name _;

    location = /metrics {
        allow 10.0.20.46;
        deny all;
        proxy_pass http://127.0.0.1:9100/metrics;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location = /app-metrics {
        allow 10.0.20.46;
        deny all;
        proxy_pass http://127.0.0.1:8081/actuator/prometheus;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location / {
        return 404;
    }
}
