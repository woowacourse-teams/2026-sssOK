# 중앙 단일 테넌트. environment 라벨에 따라 개발 7일·운영 30일 보존.
auth_enabled: false
server:
  http_listen_port: 3100
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2026-09-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  # 환경 라벨이 없는 기동 확인 로그 등은 하루만 보관한다.
  retention_period: 24h
  retention_stream:
    - selector: '{environment="dev"}'
      priority: 1
      period: 168h
    - selector: '{environment="prod"}'
      priority: 1
      period: 720h
  # 보관 기간과 별개인 수신 제한. 과거 로그 이관 없이 신규 로그부터 연결한다.
  reject_old_samples: true
  reject_old_samples_max_age: 24h
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  per_stream_rate_limit: 1MB
  per_stream_rate_limit_burst: 2MB
  max_global_streams_per_user: 1000
  max_label_names_per_series: 8
  discover_service_name: []
  max_query_parallelism: 2
  tsdb_max_query_parallelism: 2
  volume_enabled: true
querier:
  max_concurrent: 2
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 16
pattern_ingester:
  enabled: false
analytics:
  reporting_enabled: false
