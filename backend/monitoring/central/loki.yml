# 기동 확인용 단일 테넌트. 실제 dev/prod 로그는 아직 전송하지 않는다.
auth_enabled: false
server:
  http_listen_port: 3100
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2026-09-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 24h
  reject_old_samples: true
  reject_old_samples_max_age: 24h
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  per_stream_rate_limit: 1MB
  per_stream_rate_limit_burst: 2MB
  max_global_streams_per_user: 1000
  max_label_names_per_series: 8
  discover_service_name: []
  max_query_parallelism: 2
  tsdb_max_query_parallelism: 2
  volume_enabled: true
querier:
  max_concurrent: 2
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 16
pattern_ingester:
  enabled: false
analytics:
  reporting_enabled: false
