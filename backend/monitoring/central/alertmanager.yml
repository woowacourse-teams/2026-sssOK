# 알림 판정·중복 억제만 검증한다. 외부 발송 설정과 비밀값은 연결하지 않는다.
route:
  receiver: bootstrap
  group_by: [environment, server, alertname, severity, host]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: bootstrap

inhibit_rules:
  # 라벨이 없는 알림끼리 같다고 판정되지 않도록 필수 대상 라벨도 검사한다.
  - source_matchers:
      - 'alertname="HostDiskSpaceCritical"'
      - 'severity="critical"'
      - 'environment=~"dev|prod|monitoring"'
      - 'server!=""'
      - 'instance!=""'
      - 'mountpoint!=""'
    target_matchers:
      - 'alertname="HostDiskSpaceLow"'
      - 'severity="warning"'
    equal: [environment, server, instance, device, mountpoint]
  - source_matchers:
      - 'alertname=~"HostDiskSpaceLow|HostDiskSpaceCritical"'
      - 'environment=~"dev|prod|monitoring"'
      - 'server!=""'
      - 'instance!=""'
      - 'mountpoint!=""'
    target_matchers:
      - 'alertname="HostDiskWillFillIn24h"'
      - 'severity="warning"'
    equal: [environment, server, instance, device, mountpoint]
  # 대표 알림은 선택한 모든 개발 발송 묶음에 포함한다. 무발송 알림이 발송 알림을 숨기지 않게 한다.
  - source_matchers:
      - 'alertname="MetricsEndpointDown"'
      - 'environment=~"dev|prod"'
      - 'server!=""'
      - 'instance!=""'
    target_matchers:
      - 'alertname=~"BackendDown|LogPipelineDown|NodeMetricsDown"'
    equal: [environment, server, instance]
