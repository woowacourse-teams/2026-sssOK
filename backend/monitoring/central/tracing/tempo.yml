stream_over_http_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
usage_report:
  reporting_enabled: false
querier:
  max_concurrent_queries: 2
query_frontend:
  search:
    concurrent_jobs: 2
  trace_by_id:
    query_shards: 2
backend_worker:
  compaction:
    block_retention: 24h
