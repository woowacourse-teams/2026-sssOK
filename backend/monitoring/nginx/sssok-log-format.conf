# dev EC2 에 직접 설치된 Nginx 용 접근 로그 형식. 배포 파이프라인이 옮기지 않는다 — 사람이 한 번
# /etc/nginx/conf.d/sssok-log-format.conf 로 복사하고 reload 한다 (monitoring/README.md 참고).
#
# prod 는 컨테이너 Nginx 라 backend/nginx.conf 가 같은 형식을 갖는다. 필드 이름과 뜻은 그 파일과
# 같아야 Loki 에서 dev·prod 를 같은 질의로 본다. 필드를 바꾸면 두 곳을 같이 고친다.
#
# conf.d 는 http 블록 안에서 읽힌다. 아래 access_log 는 기존 access.log 를 대체하지 않고 하나 더
# 남긴다. 기존 파일은 그대로 두고, Alloy 는 이 JSON 파일만 읽는다.
# 단, dev-api 의 server 블록에 access_log 가 따로 적혀 있으면 http 블록의 설정을 물려받지 않는다.
# 그때는 아래 access_log 줄을 그 server 블록에도 넣는다.

# 요청 ID 는 앱이 발급해 응답 헤더로 돌려준 값을 쓴다. 앱까지 못 간 요청(502·504)에는 그 헤더가
# 없으므로 Nginx 가 만든 값으로 채운다 — 이 경우 형식이 32자 hex 라 앱까지 못 갔다는 걸 바로 안다.
map $upstream_http_x_request_id $sssok_request_id {
    ''      $request_id;
    default $upstream_http_x_request_id;
}

# 상태 코드로 level 을 정한다. 그래야 `level="ERROR"` 로 찾을 때 Nginx 5xx 도 함께 나온다.
map $status $sssok_log_level {
    ~^5     ERROR;
    ~^4     WARN;
    default INFO;
}

log_format sssok_json escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"level":"$sssok_log_level",'
    '"service":"sssok-nginx",'
    '"environment":"dev",'
    '"requestId":"$sssok_request_id",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"message":"$request_method $uri $status",'
    '"durationSeconds":$request_time,'
    '"upstreamStatus":"$upstream_status",'
    '"bytesSent":$body_bytes_sent,'
    '"clientIp":"$remote_addr"'
    '}';

# 파일 이름이 *.log 라 Ubuntu 기본 logrotate(/etc/logrotate.d/nginx)가 기존 로그와 함께 회전한다.
access_log /var/log/nginx/sssok-access.log sssok_json;
