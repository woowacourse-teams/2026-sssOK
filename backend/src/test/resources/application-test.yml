spring:
  datasource:
    url: jdbc:h2:mem:sssok-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

# 서명 URL 생성은 네트워크를 타지 않아 형식만 맞으면 된다. 실제 R2 호출은 테스트에서 목으로 대체한다.
storage:
  r2:
    endpoint: https://dummy.r2.cloudflarestorage.com
    access-key: dummy-access-key
    secret-key: dummy-secret-key
    bucket: sssok-test
    public-base-url: https://dummy.example.com

# 테스트 전용 키. 운영 시크릿과 무관하며 실제 배포에는 쓰이지 않는다.
jwt:
  secret: mvtcAhMGbXlhpJ4JuIvRWJVF+yMUju6PxRCb/FMojgA=

cors:
  allowed-origins: http://localhost:3000

# 등록 직후 자동으로 도는 썸네일 워커를 끈다. 협력 객체를 목으로 둔 테스트에서 워커 스레드가
# 같은 목을 동시에 건드리면 검증이 간헐적으로 깨진다. 워커는 직접 호출해서 검증한다.
media:
  thumbnail:
    auto-generate: false
