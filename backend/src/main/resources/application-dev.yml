spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    # show-sql 은 SQL 을 로거를 거치지 않고 표준 출력에 바로 찍는다. 그러면 JSON 이 아닌 줄이 SQL 한 줄마다
    # 생겨 Loki 에서 level·requestId 없이 쪼개져 들어온다. SQL 은 아래 org.hibernate.SQL 로거로 남긴다.
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # 스키마는 Flyway가 만든다. 엔티티를 추가하면
  # db/migration/V{n}__{설명}.sql 을 함께 작성해야 validate 가 통과한다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

storage:
  r2:
    endpoint: ${R2_ENDPOINT}
    region: auto
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: ${R2_BUCKET}
    public-base-url: ${R2_PUBLIC_BASE_URL}

# 운영과 달리 개발 중 디버깅이 목적이라 SQL과 com.sssok 로그를 자세히 남긴다.
logging:
  level:
    root: info
    com.sssok: debug
    # 실행한 SQL. 로거로 남겨야 JSON 한 줄에 requestId 와 함께 들어간다.
    org.hibernate.SQL: debug

  # 수집 대상 환경이라 로그를 한 줄 JSON 으로 낸다. 필드 규격은 SssOkJsonLogFormatter 가 갖는다.
  # local 은 사람이 읽어야 하므로 이 설정 없이 평문 그대로 둔다.
  structured:
    format:
      console: com.sssok.common.logging.SssOkJsonLogFormatter
