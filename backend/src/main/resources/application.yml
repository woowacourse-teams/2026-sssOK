spring:
  application:
    name: sssOK

  profiles:
    default: local

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  mvc:
    async:
      # SSE 브로드캐스트와 zip 스트리밍 응답이 임의로 끊기지 않도록 컨테이너 레벨 타임아웃 해제.
      # 개별 수명은 SseEmitter 생성 시점에 직접 지정한다.
      request-timeout: -1

  task:
    # 업로드 후 리사이즈/압축을 처리하는 @Async 워커
    execution:
      thread-name-prefix: media-worker-
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
    # 방 만료 TTL / 보관 기간 경과 후 영구 삭제 @Scheduled 배치
    scheduling:
      thread-name-prefix: batch-
      pool:
        size: 2

jwt:
  # 시크릿 자체는 실제 값을 커밋하지 않는다 — 로컬은 application-local.yml(gitignored), CI/운영은 환경변수로 공급한다.
  secret: ${JWT_SECRET}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30d}

release:
  # 통합 릴리스 버전(저장소 루트 VERSION)과 배포 대상 커밋. 배포 파이프라인이 image.env 에 쓰고
  # docker-compose 가 컨테이너 환경변수로 넘긴다.
  # 로컬·IDE 실행에는 주입이 없으므로 unknown 으로 떨어뜨린다.
  version: ${APP_RELEASE_VERSION:unknown}
  git-sha: ${APP_GIT_SHA:unknown}
  # 백엔드 버전의 1순위는 JAR 안의 build-info 다. 이 값은 build-info 가 없을 때만 쓰인다.
  backend-version: ${APP_BACKEND_VERSION:unknown}

cors:
  # 브라우저에서 API를 호출할 수 있는 오리진. 콤마로 구분한다.
  # 로컬 기본값은 application-local.yml, 운영값은 환경변수로 공급한다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

room:
  code-length: 8
  default-ttl: 24h
  expiration-change-limit: 3
  # 수명을 다한 방을 실제로 지우는 시각. 보관 기간 자체는 RetentionPolicy 가 갖는다.
  purge-cron: "0 0 4 * * *"

upload:
  image-max-size: 10MB
  video-max-size: 1GB
  presigned-url-ttl: 10m
  # 서명 URL 무한 발급을 막는 상한. 넘으면 처음부터 다시 올려야 한다.
  max-retry-count: 5

media:
  resize-target-width: 1600
  # GIF는 애니메이션이 깨지므로 리사이즈/압축 대상에서 제외한다
  skip-formats: gif
  thumbnail:
    # 목록 타일 기준 너비. 고해상도 화면에서도 흐리지 않을 만큼만 크게 잡는다
    max-width: 400
    # 이 시간이 지나도 PROCESSING이면 재시작·실패로 작업이 사라진 것으로 보고 다시 태운다
    stuck-after: 10m
    sweep-batch-size: 50
    sweep-cron: "0 */5 * * * *"
    # 목록 조회 응답에 직접 싣는 썸네일 서명 URL의 유효기간. 다운로드용(5분)보다 길게 잡는다.
    display-url-ttl: 30m
  video:
    # 어느 지점의 프레임을 쓸지. 맨 첫 프레임이 검은 화면인 영상이 많아 조금 뒤를 집는다
    frame-at: 1s
    # 이 시간을 넘기면 포기하고 썸네일 없이 완료한다
    timeout: 20s
    # 이미지 썸네일과 같은 너비여야 한 줄에 섞여도 크기가 맞는다
    thumbnail-max-width: 400
    # ffmpeg에 넘길 원본 서명 URL의 유효기간. timeout보다 넉넉해야 추출 도중에 만료되지 않는다
    source-url-ttl: 10m
    worker:
      # ffmpeg 작업이 사진 썸네일·ZIP 압축의 공용 풀을 점유하지 않도록 별도 풀을 쓴다
      core-size: 2
      max-size: 2
      queue-capacity: 50

feedback:
  # 같은 회원이 이 간격 안에 다시 의견을 보내면 429. 오타를 고쳐 다시 쓰는 정도는 막지 않으면서
  # 자동화된 반복 등록은 걸러내는 선으로 잡았다.
  rate-limit-window: 1m

storage:
  cleanup:
    # 삭제 커밋 뒤 오브젝트 정리를 비동기로 띄울지. 협력 객체를 목으로 둔 테스트에서만 끈다.
    auto-purge: true
    # 이 시간이 지나도 정리 대기열에 남아 있으면 비동기 정리가 유실된 것으로 보고 다시 태운다
    retry-after: 5m
    sweep-batch-size: 200
    sweep-cron: "0 */10 * * * *"

download:
  # 단건 다운로드 리다이렉트 대상 서명 URL의 유효기간
  presigned-get-ttl: 5m
  # 동일 멤버가 동시에 진행(QUEUED/RUNNING) 중일 수 있는 압축 잡의 최대 개수. 넘으면 429.
  max-concurrent-jobs-per-requester: 3
  # zip 압축 잡의 보관 기간. READY(압축 완료) 시점부터 센다. 지나면 410, 배치가 실물을 정리한다.
  retention: 1h
  # 보관 기간이 지난 zip을 정리하는 시각(10분마다).
  sweep-cron: "0 */10 * * * *"

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
