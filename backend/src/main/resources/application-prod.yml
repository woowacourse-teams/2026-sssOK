spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # 스키마는 Flyway가 만든다. 엔티티를 추가하면
  # db/migration/V{n}__{설명}.sql 을 함께 작성해야 validate 가 통과한다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  guest-token-ttl: 24h

storage:
  r2:
    endpoint: ${R2_ENDPOINT}
    region: auto
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: ${R2_BUCKET}
    public-base-url: ${R2_PUBLIC_BASE_URL}

logging:
  level:
    root: info
    com.sssok: info